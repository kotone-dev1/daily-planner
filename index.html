  /* ---------- 音声 ---------- */

  var recognition = null;

  function voiceSupported() {
    return !!(window.DP_VOICE && (window.SpeechRecognition || window.webkitSpeechRecognition));
  }

  var voiceTarget = "catchInput";

  function startVoice(target) {
    voiceTarget = target || "catchInput";
    if (recognition) { stopVoice(); return; }
    var Recognizer = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognizer) {
      $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "この端末では音声入力を使えません。文字で入力してください。";
      return;
    }

    recognition = new Recognizer();
    recognition.lang = "ja-JP";
    recognition.interimResults = true;
    recognition.continuous = false;
    state.usedVoice = true;

    var gotResult = false;
    var gotError = false;

    recognition.onstart = function () { setMic(true); $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = ""; };
    recognition.onresult = function (e) {
      gotResult = true;
      var text = "";
      for (var i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      $(voiceTarget).value = text;
      if (voiceTarget === "catchInput") updateSaveState();
      else parsePlanInput();
    };
    recognition.onerror = function (e) {
      gotError = true;
      var code = e && e.error ? e.error : "unknown";
      if (code === "not-allowed" || code === "service-not-allowed") {
        $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "マイクが許可されていません（" + code + "）。";
        $(voiceTarget).focus(); // マイクを開けなかったときだけフォーカスする
      } else if (code === "no-speech") {
        $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "聞き取れませんでした。もう一度押して話してください。";
      } else if (code === "audio-capture") {
        $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "マイクが見つかりませんでした（audio-capture）。";
      } else if (code === "language-not-supported") {
        $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "この端末は日本語の音声認識に対応していません。";
      } else {
        $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "音声を認識できませんでした（" + code + "）。";
      }
    };
    recognition.onend = function () {
      setMic(false);
      recognition = null;
      if (!gotResult && !gotError) {
        $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "認識が始まらずに終了しました。文字で入力してください。";
      }
    };

    try { recognition.start(); }
    catch (err) {
      setMic(false);
      recognition = null;
      $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "マイクを開けませんでした（" + String(err && err.name || err) + "）。";
      $(voiceTarget).focus();
    }
  }

  function stopVoice() {
    if (!recognition) return;
    try { recognition.stop(); } catch (e) {}
    recognition = null;
    setMic(false);
  }

  function setMic(listening) {
    var isPlan = voiceTarget === "planInput";
    var btn = $(isPlan ? "planMic" : "micBtn");
    var label = $(isPlan ? "planMicLabel" : "micLabel");
    if (!btn) return;
    btn.setAttribute("data-listening", listening ? "true" : "false");
    label.textContent = listening ? "聞いています（押すと止まる）" : (isPlan ? "話す" : "話して追加");
  }

  /* ---------- 詳細 ---------- */

  function openDetail(taskId) {
    state.detailTaskId = taskId;
    $("detailMsg").textContent = "";
    $("detailBackdrop").hidden = false;
    $("detailSheet").hidden = false;
    $("detailTitle").textContent = "読み込み中";
    $("detailSub").textContent = "";
    $("detailFacts").textContent = "";
    $("detailWarn").textContent = "";

    call("getTask", { id: taskId })
      .then(renderDetail)
      .catch(function (err) { $("detailTitle").textContent = err.message; });
  }

  function renderDetail(t) {
    state.detailTask = t;
    $("tTitle").value = t.title || "";
    $("tEstimate").value = t.remainMin != null ? t.remainMin : (t.estimateMin || "");
    $("tDue").value = t.due || "";
    $("tPriority").value = String(t.priority || 3);
    fillCategories($("tCategory"), t.category);
    $("detailTitle").textContent = t.title;
    $("detailSub").textContent = [t.category, (t.remainMin != null ? t.remainMin : t.estimateMin) + "分", t.due || "期限なし"].join(" · ");

    var warn = warningFor(t.id);
    $("detailWarn").textContent = warn ? reasonText(warn) : "";

    $("dTitle").value = t.title || "";
    $("dEstimate").value = t.remainMin != null ? t.remainMin : t.estimateMin;
    $("dDue").value = t.due || "";
    $("dPriority").value = String(t.priority || 3);
    fillCategories($("dCategory"), t.category);

    var facts = $("detailFacts");
    facts.textContent = "";
    addFact(facts, "これは何か", t.detail || "（説明はありません）");
    addFact(facts, "受け取った日", t.receivedAt || "（不明）");
    addFact(facts, "発生源", t.source || "手入力");
    addFact(facts, "優先度", PRIORITY_LABEL[t.priority] || "通常");
    if (t.memo) addFact(facts, "メモ", t.memo);
    if (t.sourceUrl) addFact(facts, "出典", t.sourceUrl);
  }

  function saveDetail() {
    if (!state.detailTaskId) return;
    var minutes = Number($("dEstimate").value) || null;
    $("detailSave").disabled = true;
    mutate("updateTask", {
      id: state.detailTaskId,
      patch: {
        title: $("dTitle").value.trim(),
        remainMin: minutes,
        estimateMin: minutes,
        due: $("dDue").value || "",
        priority: Number($("dPriority").value) || 3,
        category: $("dCategory").value
      }
    }).then(function () { $("detailSave").disabled = false; });
  }

  function warningFor(taskId) {
    var list = (state.day && state.day.warnings) || [];
    for (var i = 0; i < list.length; i++) if (list[i].taskId === taskId) return list[i];
    return null;
  }

  function addFact(box, term, value) {
    var wrap = document.createElement("dl");
    wrap.className = "fact";
    var dt = document.createElement("dt");
    dt.textContent = term;
    var dd = document.createElement("dd");
    dd.textContent = value;
    wrap.appendChild(dt);
    wrap.appendChild(dd);
    box.appendChild(wrap);
  }

  function closeDetail() {
    $("detailBackdrop").hidden = true;
    $("detailSheet").hidden = true;
    state.detailTaskId = null;
  }

  function mutate(action, payload, onError) {
    return call(action, payload)
      .then(function () { closeDetail(); closeSwipes(); return refreshAll(); })
      .catch(function (err) { (onError || function (m) { $("detailMsg").textContent = m; })(err.message); });
  }

  function startTask(taskId) {
    if (!state.startLogged) {
      logKpi("firstStart", Date.now() - state.openedAt);
      state.startLogged = true;
    }
    return mutate("updateTask", { id: taskId, patch: { status: "進行中" } });
  }

  function completeTask(taskId) {
    return mutate("updateTask", { id: taskId, patch: { status: "完了" } });
  }

  function deferTask(taskId) {
    return mutate("updateTask", { id: taskId, patch: { notBefore: addDaysKey(todayKey(), 1), status: "未着手" } });
  }

  function deleteTask(taskId) {
    return mutate("deleteTask", { id: taskId });
  }

  /** 一度入れたタスクを直す。題も時間も期限も分類も、ここで変えられる。 */
  function saveTaskEdits() {
    var id = state.detailTaskId;
    if (!id) return;
    var minutes = Number($("tEstimate").value);
    var patch = {
      title: $("tTitle").value.trim(),
      due: $("tDue").value || "",
      priority: Number($("tPriority").value) || 3,
      category: $("tCategory").value
    };
    if (minutes > 0) {
      patch.remainMin = minutes;
      var current = state.detailTask || {};
      // 残りを増やしたら見積も追いつかせる（残り > 見積 の矛盾を作らない）
      if (!current.estimateMin || minutes > current.estimateMin) patch.estimateMin = minutes;
    }
    if (!patch.title) { $("detailMsg").textContent = "題を入れてください。"; return; }

    $("actSaveTask").disabled = true;
    mutate("updateTask", { id: id, patch: patch })
      .then(function () { $("actSaveTask").disabled = false; })
      .catch(function () { $("actSaveTask").disabled = false; });
  }

  /* ---------- 設定 ---------- */

  var SETTING_FIELDS = [
    ["作業時間", [["workStart", "開始", "time"], ["workEnd", "終了", "text"]]],
    ["ブロック", [
      ["chunkMinMin", "最短（分）", "number"],
      ["chunkMaxMin", "最長（分）", "number"],
      ["breakMin", "休憩（分）", "number"],
      ["bufferMin", "予定前後（分）", "number"],
      ["horizonDays", "何日先まで", "number"]
    ]],
    ["分類", [["categories", "名前", "text"], ["defaultCategory", "未判定のとき", "text"]]],
    ["カレンダー", [["readCalendarIds", "読み込む", "text"], ["ignoreEventPattern", "無視する予定", "text"]]]
  ];

  function renderSettings() {
    var box = $("settingsBody");
    box.textContent = "";

    if (window.DP_NEEDS_CONNECTION) box.appendChild(connectionSection());
    if (!state.settings) {
      if (!window.DP_NEEDS_CONNECTION || loadConnection()) {
        call("getSettings").then(function (s) { state.settings = s; renderSettings(); }).catch(function () {});
      }
      return;
    }

    SETTING_FIELDS.forEach(function (grp) {
      var title = document.createElement("div");
      title.className = "group-title";
      title.textContent = grp[0];
      box.appendChild(title);

      var group = document.createElement("div");
      group.className = "group";
      grp[1].forEach(function (field) {
        var row = document.createElement("div");
        row.className = "field";
        var lab = document.createElement("label");
        lab.textContent = field[1];
        lab.setAttribute("for", "set_" + field[0]);
        var input = document.createElement("input");
        input.id = "set_" + field[0];
        input.type = field[2];
        var value = state.settings[field[0]];
        input.value = Array.isArray(value) ? value.join(",") : (value == null ? "" : value);
        row.appendChild(lab);
        row.appendChild(input);
        group.appendChild(row);
      });
      box.appendChild(group);
    });

    var save = document.createElement("button");
    save.className = "bigbtn filled";
    save.type = "button";
    save.textContent = "保存して作り直す";
    save.addEventListener("click", saveSettingsFromForm);
    box.appendChild(save);

    var regen = document.createElement("button");
    regen.className = "bigbtn";
    regen.type = "button";
    regen.textContent = "いま時間割を作り直す";
    regen.addEventListener("click", function () {
      regen.disabled = true;
      call("regenerate", { now: new Date().toISOString() })
        .then(refreshAll)
        .catch(function () {})
        .then(function () { regen.disabled = false; });
    });
    box.appendChild(regen);

    if (!window.DP_NEEDS_CONNECTION) box.appendChild(codeSection());

    var version = document.createElement("div");
    version.className = "parsed";
    version.textContent = "画面の版 " + (window.DP_BUILD || "不明") +
      " / 解析 " + (typeof parseFixed === "function" ? "読み込みずみ" : "未読み込み");
    box.appendChild(version);
  }

  /** GAS 側の画面でだけ出す。iPhone に入れる PWA へ渡す接続コード。 */
  function codeSection() {
    var wrap = document.createElement("div");
    var title = document.createElement("div");
    title.className = "group-title";
    title.textContent = "iPhone用の接続コード";
    wrap.appendChild(title);

    var group = document.createElement("div");
    group.className = "group";
    var row = document.createElement("div");
    row.className = "field";
    var input = document.createElement("input");
    input.type = "text";
    input.readOnly = true;
    input.style.textAlign = "left";
    input.value = "取得しています";
    row.appendChild(input);
    group.appendChild(row);
    wrap.appendChild(group);

    call("connectionCode")
      .then(function (r) { input.value = r.code; })
      .catch(function (err) { input.value = err.message; });

    return wrap;
  }

  function connectionSection() {
    var wrap = document.createElement("div");
    var title = document.createElement("div");
    title.className = "group-title";
    title.textContent = "接続";
    wrap.appendChild(title);

    var group = document.createElement("div");
    group.className = "group";
    var row = document.createElement("div");
    row.className = "field";
    var input = document.createElement("input");
    input.type = "text";
    input.id = "connCode";
    input.style.textAlign = "left";
    input.placeholder = "接続コードを貼る";
    row.appendChild(input);
    group.appendChild(row);
    wrap.appendChild(group);

    var msg = document.createElement("div");
    msg.className = "msg";
    wrap.appendChild(msg);

    var btn = document.createElement("button");
    btn.className = "bigbtn filled";
    btn.type = "button";
    btn.textContent = window.DP_CONNECTION ? "接続しなおす" : "接続する";
    btn.addEventListener("click", function () {
      try { saveConnection(input.value.trim()); }
      catch (e) { msg.textContent = "接続コードを読み取れませんでした。"; return; }
      msg.textContent = "確認しています";
      call("ping")
        .then(function () {
          msg.textContent = "";
          state.settings = null;
          return refreshAll().then(function () { switchTab("day"); });
        })
        .catch(function (err) { msg.textContent = err.message; });
    });
    wrap.appendChild(btn);
    return wrap;
  }

  function saveSettingsFromForm() {
    var patch = {};
    SETTING_FIELDS.forEach(function (grp) {
      grp[1].forEach(function (field) {
        var input = $("set_" + field[0]);
        if (input) patch[field[0]] = input.value;
      });
    });

    call("saveSettings", { patch: patch })
      .then(function (s) {
        state.settings = s;
        return call("regenerate", { now: new Date().toISOString() });
      })
      .then(refreshAll)
      .catch(function (err) { alert(err.message); });
  }

  /* ---------- KPI ---------- */

  function logKpi(kind, ms) {
    try { window.DP_CALL("logEvent", { kind: kind, detail: String(Math.round(ms / 100) / 10) + "秒" }); }
    catch (e) {}
  }

  /* ---------- タブ ---------- */

  function switchTab(name) {
    state.view = name;
    $("viewDay").hidden = name !== "day";
    $("viewNext").hidden = name !== "next";
    $("viewSettings").hidden = name !== "settings";
    $("fab").hidden = name === "settings";
    closeSwipes();

    var buttons = document.querySelectorAll(".tabbar button");
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute("data-tab") === name) buttons[i].setAttribute("aria-current", "page");
      else buttons[i].removeAttribute("aria-current");
    }

    if (name === "next") loadUpcoming();
    if (name === "settings") renderSettings();
  }

  function refreshAll() {
    var jobs = [];
    if (state.dayKey && state.dayKey !== todayKey()) jobs.push(loadDay(state.dayKey));
    else jobs.push(loadToday(false));
    if (state.view === "next") jobs.push(loadUpcoming());
    return Promise.all(jobs);
  }

  /* ---------- 起動 ---------- */

  function boot() {
    var tabs = document.querySelectorAll(".tabbar button");
    for (var i = 0; i < tabs.length; i++) {
      (function (b) {
        b.addEventListener("click", function () {
          if (b.getAttribute("data-tab") === "day" && state.dayKey !== todayKey()) loadToday(false);
          switchTab(b.getAttribute("data-tab"));
        });
      })(tabs[i]);
    }

    $("backBtn").addEventListener("click", function () {
      loadToday(true);
      switchTab("next");
    });

    $("fab").addEventListener("click", function () {
      state.addOpenedAt = Date.now();
      state.usedVoice = false;
      openAdd();
    });
    $("addCancel").addEventListener("click", closeAdd);
    $("addBackdrop").addEventListener("click", closeAdd);
    $("catchInput").addEventListener("input", updateSaveState);
    $("toReview").addEventListener("click", toReview);
    $("saveAll").addEventListener("click", saveAll);
    $("backToSpeak").addEventListener("click", function () { showStage("speak"); });
    $("editClose").addEventListener("click", closeEdit);
    $("editBackdrop").addEventListener("click", closeEdit);
    $("editApply").addEventListener("click", applyEdit);
    $("eKind").addEventListener("change", syncEditRows);

    var mic = $("micBtn");
    if (!voiceSupported()) mic.hidden = true;
    else mic.addEventListener("click", function () { startVoice("catchInput"); });

    $("planDayBtn").addEventListener("click", openPlan);
    $("planCancel").addEventListener("click", closePlan);
    $("planBackdrop").addEventListener("click", closePlan);
    $("planInput").addEventListener("input", parsePlanInput);
    $("planApply").addEventListener("click", applyPlan);
    var planMic = $("planMic");
    if (!voiceSupported()) planMic.hidden = true;
    else planMic.addEventListener("click", function () { startVoice("planInput"); });

    $("detailClose").addEventListener("click", closeDetail);
    $("detailBackdrop").addEventListener("click", closeDetail);
    $("actStart").addEventListener("click", function () { startTask(state.detailTaskId); });
    $("actDone").addEventListener("click", function () { completeTask(state.detailTaskId); });
    $("actDefer").addEventListener("click", function () { deferTask(state.detailTaskId); });
    $("actDelete").addEventListener("click", function () { deleteTask(state.detailTaskId); });
    $("actSaveTask").addEventListener("click", saveTaskEdits);
    $("detailSave").addEventListener("click", saveDetail);

    $("scroll").addEventListener("scroll", function () { closeSwipes(); }, { passive: true });

    if (window.DP_NEEDS_CONNECTION && !loadConnection()) {
      switchTab("settings");
      return;
    }
    switchTab("day");
    loadToday(true);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>


<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
