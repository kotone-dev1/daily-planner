<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Planner">
<style>
  :root {
    --bg-0: #000000;
    --bg-1: #111113;
    --bg-2: #1c1c1f;
    --text-1: #f2f2f4;
    --text-2: #98989f;
    --hairline: #2c2c30;
    --accent-warn: #ff453a;
    --e1: var(--bg-1);
    --e2: var(--bg-2);
    --e3: #26262a;
    --tap-min: 44px;
    --shadow-raised: 0 1px 0 rgba(255,255,255,0.05) inset, 0 2px 5px rgba(0,0,0,0.5);
    --shadow-pressed: 0 1px 2px rgba(0,0,0,0.4) inset;
  }
  :root[data-theme="light"] {
    --bg-0: #ffffff;
    --bg-1: #f5f5f7;
    --bg-2: #ebebee;
    --text-1: #1c1c1e;
    --text-2: #6b6b70;
    --hairline: #d9d9dd;
    --accent-warn: #d70015;
    --e1: var(--bg-1);
    --e2: var(--bg-2);
    --e3: #e1e1e5;
    --shadow-raised: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 3px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.08);
    --shadow-pressed: 0 1px 2px rgba(0,0,0,0.12) inset;
  }
  /* 既定は黒ベース(iPhone時計アプリ相当)。ライトは data-theme="light" を
     明示したときだけ。システムのライト/ダーク設定には追従しない。 */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-0); color: var(--text-1);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .tab-panel { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
  .tab-panel[hidden] { display: none; }

  /* --- 警告バナー --- */
  #warningBanner {
    background: var(--bg-1);
    border-bottom: 1px solid var(--hairline);
    padding: 12px 16px;
  }
  #warningBanner[hidden] { display: none; }
  #warningSummary {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--accent-warn); font-weight: 600; font-size: 15px;
    min-height: var(--tap-min); cursor: pointer;
  }
  #warningList { margin-top: 8px; display: none; }
  #warningBanner.expanded #warningList { display: block; }
  #warningBanner.expanded #warningChevron { transform: rotate(180deg); }
  .warning-row { padding: 8px 0; font-size: 14px; color: var(--text-1); border-top: 1px solid var(--hairline); }
  .warning-row .state { color: var(--text-2); font-size: 12px; }

  /* --- 今日: 今日に配置されたタスクをカード状に(境目をはっきりさせる) --- */
  .schedule-list { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 4px; }
  .schedule-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; min-height: var(--tap-min);
    border-radius: 12px; background: var(--e1);
    box-shadow: var(--shadow-raised); touch-action: pan-y;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .schedule-row.dragging {
    box-shadow: var(--shadow-raised), 0 8px 20px rgba(0,0,0,0.35);
    transform: scale(1.02); position: relative; z-index: 5;
  }
  .weight-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .weight-dot.light { background: #C9BFE0; }
  .weight-dot.medium { background: #9B7FDB; }
  .weight-dot.heavy { background: #6A3FD6; }
  .row-cat-bar { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
  .row-title { flex: 1; font-size: 15px; }
  .row-title .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .mini-stage-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .mini-stage { display: flex; gap: 5px; }
  .mini-stage span { width: 7px; height: 7px; border-radius: 50%; background: var(--hairline); flex-shrink: 0; }
  .mini-stage span.filled { background: #9B7FDB; }
  .mini-stage-label { color: var(--text-2); font-size: 12px; }
  .empty-state { padding: 40px 16px; color: var(--text-2); font-size: 14px; text-align: center; }

  /* --- タスクタブ --- */
  .chip-row { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--hairline);
    font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--bg-1);
    color: var(--text-1); min-height: var(--tap-min); display: flex; align-items: center;
    box-shadow: var(--shadow-raised); transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .chip:active { transform: scale(0.92); }
  .chip.active { background: var(--text-1); color: var(--bg-0); border-color: var(--text-1); box-shadow: var(--shadow-pressed); }
  .task-row {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    min-height: var(--tap-min); border-bottom: 1px solid var(--hairline);
  }
  .task-row .row-title { display: flex; flex-direction: column; }
  .task-row .row-title .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .task-row .deadline { font-size: 13px; color: var(--text-2); flex-shrink: 0; }
  .task-row .deadline.overdue { color: var(--accent-warn); font-weight: 600; }

  /* --- 設定タブ --- */
  .settings-section { padding: 20px 16px; border-bottom: 1px solid var(--hairline); }
  .settings-section h2 {
    font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 12px;
  }
  .field-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; gap: 12px; }
  .field-row label { font-size: 15px; }
  .field-row input[type="text"], .field-row input[type="number"], .field-row textarea {
    background: var(--e2); border: 1px solid var(--hairline); border-radius: 8px;
    color: var(--text-1); padding: 8px 10px; font-size: 15px; min-height: var(--tap-min);
  }
  .field-row input[type="number"] { width: 80px; text-align: right; }
  textarea#connectionCode { width: 100%; min-height: 72px; font-family: monospace; font-size: 13px; }
  button.plain {
    background: none; border: none; color: var(--text-1); font-size: 15px;
    min-height: var(--tap-min); padding: 0; text-align: left;
  }
  button.plain.danger {
    color: var(--accent-warn); text-align: center; width: 100%;
    background: var(--e1); border: 1px solid var(--hairline); border-radius: 10px; font-weight: 600;
    box-shadow: var(--shadow-raised); transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  button.plain.danger:active { box-shadow: var(--shadow-pressed); transform: translateY(1px) scale(0.98); }
  button.primary {
    background: var(--text-1); color: var(--bg-0); border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; min-height: var(--tap-min); padding: 0 16px; width: 100%;
    box-shadow: var(--shadow-raised); transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  button.primary:active {
    box-shadow: var(--shadow-pressed); transform: translateY(1px) scale(0.97);
  }
  button.primary.danger-fill { background: var(--accent-warn); color: #fff; }
  .category-edit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .category-edit-row input[type="text"] { flex: 1; }
  .category-edit-row input[type="color"] { width: 32px; height: 32px; border: none; background: none; padding: 0; }

  /* --- タブバー --- */
  #tabbar {
    display: flex; border-top: 1px solid var(--hairline); background: var(--bg-1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #tabbar button {
    flex: 1; background: none; border: none; color: var(--text-2); font-size: 11px;
    padding: 8px 0 6px; margin: 6px 4px 0; min-height: 52px; font-weight: 400;
    border-radius: 10px; transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .1s ease, box-shadow .1s ease;
  }
  #tabbar button:active { transform: scale(0.9); }
  #tabbar button.active { color: var(--text-1); font-weight: 600; background: var(--e1); box-shadow: var(--shadow-raised); }

  #fabAdd {
    position: fixed; right: 20px; bottom: calc(72px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 28px; border: none;
    background: var(--text-1); color: var(--bg-0); font-size: 28px; line-height: 1;
    box-shadow: var(--shadow-raised), 0 4px 12px rgba(0,0,0,0.3);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  #fabAdd:active {
    box-shadow: var(--shadow-pressed); transform: translateY(1px) scale(0.92);
  }

  /* --- ボトムシート --- */
  #sheetBackdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10;
  }
  #sheetBackdrop[hidden] { display: none; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--bg-1); border-radius: 16px 16px 0 0;
    max-height: 86vh; overflow-y: auto;
    padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  .sheet[hidden] { display: none; }
  .sheet-handle { width: 36px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 8px auto 16px; }
  .sheet h2 { font-size: 17px; font-weight: 600; margin: 0 0 16px; }
  .sheet textarea, .sheet input[type="text"] {
    width: 100%; background: var(--e2); border: 1px solid var(--hairline); border-radius: 10px;
    color: var(--text-1); font-size: 16px; padding: 12px; min-height: var(--tap-min);
  }
  .mic-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  #micButton {
    width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--hairline);
    background: var(--e2); color: var(--text-1); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-raised); transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  #micButton:active { box-shadow: var(--shadow-pressed); transform: translateY(1px) scale(0.93); }
  #micButton.recording { background: var(--accent-warn); color: #fff; border-color: var(--accent-warn); }
  .parsed-preview { margin: 16px 0; }
  .parsed-preview .chip-row { padding: 0; margin-top: 8px; }
  .field-inline { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .field-inline label { font-size: 13px; color: var(--text-2); width: 5em; flex-shrink: 0; }
  .detail-block { padding: 10px 0; border-bottom: 1px solid var(--hairline); }
  .detail-block .label { font-size: 12px; color: var(--text-2); }
  .detail-block .value { font-size: 15px; margin-top: 2px; }
  #qaAnswer { margin-top: 12px; font-size: 14px; background: var(--e2); border-radius: 10px; padding: 12px; }
  #qaAnswer[hidden] { display: none; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-actions button { flex: 1; }
  .sheet-actions[hidden] { display: none; }

  /* --- 編集タスク: 5段階の進捗スライダー --- */
  .stage-track { position: relative; height: 32px; margin: 24px 4px 0; }
  .stage-dots {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
  }
  .stage-dots::before {
    content: ''; position: absolute; left: 6px; right: 6px; top: 50%;
    height: 1px; background: var(--hairline); transform: translateY(-50%); z-index: 0;
  }
  .stage-dots span {
    position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%;
    background: var(--e1); border: 1px solid var(--hairline);
  }
  .stage-dots span.filled { background: var(--text-1); border-color: var(--text-1); }
  #stageSlider {
    position: absolute; left: -13px; right: -13px; top: 0; width: calc(100% + 26px); height: 32px;
    margin: 0; -webkit-appearance: none; appearance: none; background: transparent;
  }
  #stageSlider::-webkit-slider-runnable-track { background: transparent; height: 32px; }
  #stageSlider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--text-1); box-shadow: var(--shadow-raised); margin-top: 3px;
    border: 3px solid var(--bg-1);
  }
  .stage-label { text-align: center; font-size: 14px; font-weight: 600; margin-top: 10px; }

  button.secondary {
    background: var(--e2); color: var(--text-1); border: 1px solid var(--hairline);
    border-radius: 10px; font-size: 15px; min-height: var(--tap-min);
    box-shadow: var(--shadow-raised); transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  button.secondary:active { box-shadow: var(--shadow-pressed); transform: translateY(1px) scale(0.97); }
  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: var(--e3); color: var(--text-1); padding: 10px 16px; border-radius: 10px;
    font-size: 13px; z-index: 20; max-width: 80vw; text-align: center;
  }
  #confirmSheet { z-index: 12; }
  #confirmMessage { font-size: 15px; line-height: 1.6; margin: 4px 0 20px; }
</style>
</head>
<body>
<div id="app">
  <div id="warningBanner" hidden>
    <div id="warningSummary">
      <span id="warningText"></span>
      <span id="warningChevron">▾</span>
    </div>
    <div id="warningList"></div>
  </div>

  <main>
    <section id="tab-today" class="tab-panel">
      <div id="scheduleList" class="schedule-list"></div>
    </section>

    <section id="tab-tasks" class="tab-panel" hidden>
      <div id="categoryChips" class="chip-row"></div>
      <div id="taskList"></div>
    </section>

    <section id="tab-settings" class="tab-panel" hidden>
      <div class="settings-section">
        <h2>ブロック</h2>
        <div class="field-row"><label>最短(分)</label><input type="number" id="setMinBlock"></div>
        <div class="field-row"><label>最長(分)</label><input type="number" id="setMaxBlock"></div>
        <div class="field-row"><label>休憩(分)</label><input type="number" id="setBreakMin"></div>
        <div class="field-row"><label>予定前後のバッファ(分)</label><input type="number" id="setBufferMin"></div>
        <div class="field-row"><label>何日先まで置くか</label><input type="number" id="setLookahead"></div>
      </div>
      <div class="settings-section">
        <h2>カレンダー</h2>
        <div class="field-row"><label>読むカレンダーID(カンマ区切り)</label></div>
        <input type="text" id="setReadCalendars" placeholder="calendar-id-1,calendar-id-2">
        <div class="field-row" style="margin-top:12px;"><label>書き込み先カレンダーID</label></div>
        <input type="text" id="setWriteCalendar" placeholder="calendar-id">
        <div class="field-row" style="margin-top:12px;"><label>無視するカレンダーID</label></div>
        <input type="text" id="setIgnoredCalendars">
        <div class="field-row" style="margin-top:12px;"><label>無視する予定名(部分一致)</label></div>
        <input type="text" id="setIgnoredTitles" placeholder="仮,未定">
      </div>
      <div class="settings-section">
        <h2>分類</h2>
        <div id="categoryEditList"></div>
      </div>
      <div class="settings-section">
        <button class="primary" id="saveSettingsBtn">設定を保存</button>
      </div>
      <div class="settings-section" id="connectionSection" hidden>
        <h2>接続</h2>
        <textarea id="connectionCode" placeholder="接続コードを貼り付け"></textarea>
        <div class="sheet-actions">
          <button class="secondary" id="connectBtn">接続</button>
        </div>
        <div id="connectionStatus" style="margin-top:8px; font-size:13px; color: var(--text-2);"></div>
      </div>
    </section>
  </main>

  <button id="fabAdd" aria-label="タスクを追加">+</button>

  <nav id="tabbar">
    <button data-tab="today" class="active">今日</button>
    <button data-tab="tasks">タスク</button>
    <button data-tab="settings">設定</button>
  </nav>
</div>

<div id="sheetBackdrop" hidden></div>

<div id="addSheet" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <h2>追加</h2>
  <textarea id="addText" rows="2" placeholder="資料作成 40分 金曜まで"></textarea>
  <div class="mic-row">
    <button id="micButton" aria-label="話して追加">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
        <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <span id="micStatus" style="font-size:13px; color: var(--text-2);">話して追加</span>
  </div>
  <div class="parsed-preview">
    <div class="field-inline"><label>期限</label><input type="text" id="pvDeadline" placeholder="YYYY-MM-DD"></div>
    <div class="field-inline"><label>重さ</label></div>
    <div id="weightChips" class="chip-row"></div>
    <div class="field-inline" style="margin-top:8px;"><label>優先度</label></div>
    <div id="priorityChips" class="chip-row"></div>
    <div class="field-inline" style="margin-top:8px;"><label>分類</label></div>
    <div id="addCategoryChips" class="chip-row"></div>
    <div class="field-inline" style="margin-top:8px;"><label>種別</label></div>
    <div id="kindChips" class="chip-row"></div>
  </div>
  <div class="sheet-actions">
    <button class="secondary" id="cancelAddBtn">閉じる</button>
    <button class="primary" id="saveAddBtn">登録</button>
  </div>
</div>

<div id="detailSheet" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <h2 id="detailTitle"></h2>
  <div class="detail-block"><div class="label">これは何か</div><div class="value" id="detailBody"></div></div>
  <div class="detail-block"><div class="label">いつ振られたか</div><div class="value" id="detailReceived"></div></div>
  <div class="detail-block"><div class="label">見積・残り・期限</div><div class="value" id="detailNumbers"></div></div>
  <div class="detail-block"><div class="label">出典</div><div class="value" id="detailSource"></div></div>
  <div class="sheet-actions" id="bringBackRow" hidden>
    <button class="secondary" id="bringBackBtn">今日に戻す</button>
  </div>
  <div class="sheet-actions" id="simpleActions">
    <button class="secondary" id="startTaskBtn">開始</button>
    <button class="secondary" id="deferTaskBtn">延期</button>
    <button class="primary" id="completeTaskBtn">完了</button>
  </div>
  <div id="editActions" hidden>
    <div class="stage-track">
      <div class="stage-dots" id="stageDots"></div>
      <input type="range" id="stageSlider" min="0" max="4" step="1">
    </div>
    <div class="stage-label" id="stageLabel"></div>
    <div class="sheet-actions">
      <button class="secondary" id="deferEditBtn">延期</button>
      <button class="primary" id="finishEditBtn">終了</button>
    </div>
  </div>
  <div style="margin-top:16px;">
    <input type="text" id="qaInput" placeholder="これについて質問する">
    <div class="sheet-actions">
      <button class="secondary" id="qaAskBtn">聞く</button>
    </div>
    <div id="qaAnswer" hidden></div>
  </div>
  <button class="plain danger" id="deleteTaskBtn" style="margin-top:20px;">タスクを削除</button>
</div>

<div id="confirmSheet" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <p id="confirmMessage"></p>
  <div class="sheet-actions">
    <button class="secondary" id="confirmCancelBtn">キャンセル</button>
    <button class="primary danger-fill" id="confirmOkBtn">削除する</button>
  </div>
</div>

<script>
'use strict';

// ===DEMO:LOCAL-START===
// バックエンド(スプレッドシート/Apps Script)を繋がずに触れる体験版。
// core/parser.js と core/scheduler.js は本番と同じロジックをそのまま使い、
// データの保存先だけをスプレッドシートからブラウザのlocalStorageに差し替えている。

const WEEKDAY_JS = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 };

function normalizeDigits(text) {
  return text.replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
}
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function formatDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function mondayOfWeek(d) { const dow = d.getDay(); return addDays(startOfDay(d), -((dow + 6) % 7)); }
function nearestUpcomingWeekday(now, dowTarget) {
  let candidate = startOfDay(now);
  for (let i = 0; i < 7; i++) { if (candidate.getDay() === dowTarget) return candidate; candidate = addDays(candidate, 1); }
  return candidate;
}
const ESTIMATE_PATTERNS = [
  { re: /(\d+)時間(\d+)分/, toMinutes: (m) => Number(m[1]) * 60 + Number(m[2]) },
  { re: /(\d+)時間半/, toMinutes: (m) => Number(m[1]) * 60 + 30 },

  if ((m = /明日(まで)?/.exec(text))) return { value: formatDate(addDays(startOfDay(now), 1)), match: m[0] };

function demoLoadSettings_() {
  if (demoSettingsCache_) return demoSettingsCache_;
  var loaded = demoDefaultSettings_();

function demoAnswerQuestion_(task, question) {
  if (/受領|振られた|頼まれた|いつから/.test(question)) return task.receivedAt ? ('この依頼を受け取ったのは ' + task.receivedAt + ' です。') : null;
  if (/出典|どこから|ソース|リンク/.test(question)) { if (task.sourceUrl) return '出典: ' + task.sourceUrl; if (task.source) return '発生源: ' + task.source; return null; }
  if (/見積|何分|どれくらいかかる/.test(question)) { if (task.estimateMinutes == null) return null; return '見積は' + task.estimateMinutes + '分、残りは' + task.remainingMinutes + '分です。'; }
  if (/期限|いつまで/.test(question)) return task.deadline ? ('期限は ' + task.deadline + ' です。') : '期限は設定されていません。';
  if (/これは何|詳細|何のタスク/.test(question)) return task.detail || null;
  return null;
}

function demoHandleAction_(action, payload) {
  payload = payload || {};
  var tasks, task, i, now;

  if (action === 'getSettingsApi') return demoLoadSettings_();
  if (action === 'saveSettingsApi') return demoSaveSettings_(payload);
  if (action === 'listTasksApi') return demoLoadTasks_();
  if (action === 'parseTaskText') return parseTask(payload.text, new Date());

  if (action === 'createTaskDirect') {
    if (!payload.estimateMinutes || Number(payload.estimateMinutes) <= 0) throw new Error('見積時間(分)は必須です');
    tasks = demoLoadTasks_();
    now = new Date().toISOString();
    var settings = demoLoadSettings_();
    task = {
      id: demoUuid_(), title: payload.title || '', estimateMinutes: Number(payload.estimateMinutes),
      remainingMinutes: Number(payload.estimateMinutes), deadline: payload.deadline || null,
      priority: payload.priority || 3, category: payload.category || (settings.categories[settings.categories.length - 1] || {}).key,
      status: '未着手', notBefore: payload.notBefore || null, source: payload.source || '手入力',
      externalId: payload.externalId || null, sourceUrl: payload.sourceUrl || '', receivedAt: payload.receivedAt || now,
      detail: payload.detail || '', memo: payload.memo || '', actualMinutes: 0,
      createdAt: now, updatedAt: now, completedAt: '', kind: payload.kind || '', editStage: 0,
      order: Date.now(),
    };
    tasks.push(task);
    demoSaveTasks_(tasks);
    return { id: task.id };
  }

  if (action === 'updateTaskApi') {
    tasks = demoLoadTasks_();
    for (i = 0; i < tasks.length; i++) {
      if (tasks[i].id === payload.id) {
        Object.assign(tasks[i], payload.patch);
        tasks[i].updatedAt = new Date().toISOString();
        if (payload.patch.status === '完了' && !tasks[i].completedAt) tasks[i].completedAt = new Date().toISOString();
        demoSaveTasks_(tasks);
        return { ok: true };
      }
    }
    throw new Error('タスクが見つかりません: ' + payload.id);
  }

  if (action === 'deleteTaskApi') {
    tasks = demoLoadTasks_();
    var next = tasks.filter(function (t) { return t.id !== payload.id; });
    if (next.length === tasks.length) throw new Error('タスクが見つかりません: ' + payload.id);
    demoSaveTasks_(next);
    return { ok: true };
  }

  if (action === 'answerQuestion') {
    tasks = demoLoadTasks_();
    task = tasks.filter(function (t) { return t.id === payload.taskId; })[0];
    if (!task) throw new Error('タスクが見つかりません: ' + payload.taskId);
    var ans = demoAnswerQuestion_(task, payload.question);
    return { answer: ans || 'このタスクの情報からは分かりません。', method: ans ? 'rule' : 'unanswered' };
  }

  if (action === 'generateSchedule') {
    var s = demoLoadSettings_();
    var allTasks = demoLoadTasks_();
    var active = allTasks.filter(function (t) { return t.status === '未着手' || t.status === '進行中'; });
    var byId = {};
    active.forEach(function (t) { byId[t.id] = t; });
    var forScheduler = active.map(function (t) {
      return { id: t.id, title: t.title, estimateMinutes: t.estimateMinutes, remainingMinutes: t.remainingMinutes, deadline: t.deadline, priority: t.priority, notBefore: t.notBefore, createdAt: t.createdAt };
    });
    var now2 = new Date();
    var result = buildSchedule({ tasks: forScheduler, events: [], settings: s, now: now2 });
    var blocksWithMeta = result.blocks.map(function (b) {
      var t = byId[b.taskId];
      return { taskId: b.taskId, title: t ? t.title : '(不明)', category: t ? t.category : null, start: b.start, end: b.end };
    });
    var warningsWithTitle = result.warnings.map(function (w) {
      var t = byId[w.taskId];
      return { taskId: w.taskId, title: t ? t.title : '(不明)', state: w.state };
    });
    return { blocks: blocksWithMeta, taskStatus: result.taskStatus, dailyTotals: result.dailyTotals, warnings: warningsWithTitle, events: [], settings: s, now: now2.toISOString() };
  }

  throw new Error('このデモでは使えない操作です: ' + action);
}

function callApi(action, payload) {
  return new Promise(function (resolve, reject) {
    setTimeout(function () {
      try { resolve(demoHandleAction_(action, payload)); }
      catch (e) { reject(e); }
    }, 120);
  });
}

function renderSchedule() {
  var list = document.getElementById('scheduleList');
  list.innerHTML = '';
  var blocks = (state.schedule && state.schedule.blocks) || [];
  var today = todayKey();

  var seen = {};
  var todaysTaskIds = [];
  blocks.forEach(function (b) {
    if (dateKeyOf(b.start) !== today) return;
    if (seen[b.taskId]) return;
    seen[b.taskId] = true;
    todaysTaskIds.push(b.taskId);
  });

  var items = todaysTaskIds
    .map(function (id) { return state.tasks.find(function (t) { return t.id === id; }); })
    .filter(Boolean);
  items.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state">今日に配置されたタスクはありません</div>';
    return;
  }

  items.forEach(function (t) {
    var row = document.createElement('div');
    row.className = 'schedule-row';
    row.dataset.taskId = t.id;
    var cat = t.category ? categoryByKey(t.category) : null;
    var barColor = cat ? cat.color : 'var(--text-2)';
    var tier = weightTier(t.remainingMinutes);
    var sub;
    if (t.kind === '編集') {
      var stage = t.editStage || 0;
      sub = '<div class="mini-stage-row">' +
        '<div class="mini-stage" aria-hidden="true">' + STAGE_LABELS.map(function (_, i) {
          return '<span' + (i <= stage ? ' class="filled"' : '') + '></span>';
        }).join('') + '</div>' +
        '<span class="mini-stage-label">' + STAGE_LABELS[stage] + '(' + (stage + 1) + '/' + STAGE_LABELS.length + ')</span>' +
        '</div>';
    } else {
      sub = '<span class="sub">' + WEIGHT_LABELS[tier] + '</span>';
    }
    row.innerHTML =
      '<div class="weight-dot ' + tier + '"></div>' +
      '<div class="row-cat-bar" style="background:' + barColor + '"></div>' +
      '<div class="row-title">' + escapeHtml(t.title) + sub + '</div>';
    list.appendChild(row);
  });

  list.querySelectorAll('.schedule-row[data-task-id]').forEach(function (row) {
    row.addEventListener('click', function () {
      if (row._justDragged) { row._justDragged = false; return; }
      openDetail(row.dataset.taskId);
    });
  });
  attachReorder(list);
}

// ---------- 長押し→ドラッグでの並べ替え ----------
var REORDER_HOLD_MS = 450;
var REORDER_MOVE_TOLERANCE = 8;

function attachReorder(list) {
  Array.from(list.querySelectorAll('.schedule-row[data-task-id]')).forEach(function (row) {
    var pressTimer = null;
    var startX = 0, startY = 0;

    row.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY;
      pressTimer = setTimeout(function () { beginRowDrag(row, e.pointerId); }, REORDER_HOLD_MS);
    });
    row.addEventListener('pointermove', function (e) {
      if (!pressTimer) return;
      if (Math.abs(e.clientX - startX) > REORDER_MOVE_TOLERANCE || Math.abs(e.clientY - startY) > REORDER_MOVE_TOLERANCE) {
        clearTimeout(pressTimer); pressTimer = null;
      }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
      row.addEventListener(evt, function () { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } });
    });
  });
}

function beginRowDrag(row, pointerId) {
  row._justDragged = true;
  try { row.setPointerCapture(pointerId); } catch (e) { /* noop */ }
  row.classList.add('dragging');
  var list = row.parentElement;

  function onMove(e) {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    var y = e.clientY;
    var others = Array.from(list.querySelectorAll('.schedule-row[data-task-id]')).filter(function (r) { return r !== row; });
    var after = others.find(function (r) {
      var rect = r.getBoundingClientRect();
      return y < rect.top + rect.height / 2;
    });
    if (after) list.insertBefore(row, after); else list.appendChild(row);
  }
  function onUp(e) {
    if (e.pointerId !== pointerId) return;
    row.classList.remove('dragging');
    row.removeEventListener('pointermove', onMove);
    row.removeEventListener('pointerup', onUp);
    row.removeEventListener('pointercancel', onUp);
    commitScheduleOrder(list);
  }
  row.addEventListener('pointermove', onMove);
  row.addEventListener('pointerup', onUp);
  row.addEventListener('pointercancel', onUp);
}

function commitScheduleOrder(list) {
  var rows = Array.from(list.querySelectorAll('.schedule-row[data-task-id]'));
  Promise.all(rows.map(function (r, i) {
    return callApi('updateTaskApi', { id: r.dataset.taskId, patch: { order: i } });
  })).then(function () { return refreshAll(); })
    .catch(function (err) { showToast(String(err.message || err)); });
}

// ---------- タスクタブ ----------
function renderCategoryChips() {
  var wrap = document.getElementById('categoryChips');
  wrap.innerHTML = '';
  var all = document.createElement('button');
  all.className = 'chip' + (state.categoryFilter === null ? ' active' : '');
  all.textContent = 'すべて';
  all.addEventListener('click', function () { state.categoryFilter = null; renderTasks(); renderCategoryChips(); });
  wrap.appendChild(all);
  (state.settings.categories || []).forEach(function (cat) {
    var chip = document.createElement('button');
    chip.className = 'chip' + (state.categoryFilter === cat.key ? ' active' : '');
    chip.textContent = cat.label;
    chip.addEventListener('click', function () { state.categoryFilter = cat.key; renderTasks(); renderCategoryChips(); });
    wrap.appendChild(chip);
  });
  var done = document.createElement('button');
  done.className = 'chip' + (state.showCompleted ? ' active' : '');
  done.textContent = '完了済み';
  done.addEventListener('click', function () { state.showCompleted = !state.showCompleted; renderTasks(); renderCategoryChips(); });
  wrap.appendChild(done);
}

function renderTasks() {
  var list = document.getElementById('taskList');
  list.innerHTML = '';
  var today = todayKey();
  var tasks;

  if (state.showCompleted) {
    tasks = state.tasks.filter(function (t) { return t.status === '完了'; })
      .sort(function (a, b) { return (b.completedAt || '') < (a.completedAt || '') ? -1 : 1; });
  } else {
    tasks = state.tasks.filter(function (t) {
      return t.status !== '完了' && t.status !== '取消' &&
        (state.categoryFilter === null || t.category === state.categoryFilter);
    }).sort(function (a, b) {
      if (a.deadline !== b.deadline) {
        if (!a.deadline) return 1;
        if (!b.deadline) return -1;
        return a.deadline < b.deadline ? -1 : 1;
      }
      return a.priority - b.priority;
    });
  }

  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty-state">' +
      (state.showCompleted ? '完了したタスクはまだありません' : 'タスクがありません') + '</div>';
    return;
  }

  tasks.forEach(function (t) {
    var row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.taskId = t.id;
    var overdue = t.deadline && t.deadline < today;
    var sub;
    if (state.showCompleted) {
      sub = t.completedAt ? fmtDate(t.completedAt) + 'に完了' : '完了';
    } else if (t.notBefore && t.notBefore > today) {
      sub = '延期中(' + fmtDate(t.notBefore) + '〜)';
    } else if (t.kind === '編集') {
      sub = STAGE_LABELS[t.editStage || 0] + 'まで進行';
    } else {
      sub = WEIGHT_LABELS[weightTier(t.remainingMinutes)];
    }
    row.innerHTML =
      '<div class="row-title"><div>' + escapeHtml(t.title) + '</div><div class="sub">' + sub + '</div></div>' +
      '<div class="deadline' + (overdue ? ' overdue' : '') + '">' + (t.deadline ? fmtDate(t.deadline) : '') + '</div>';
    row.addEventListener('click', function () { openDetail(t.id); });
    list.appendChild(row);
  });
}

// ---------- 詳細シート ----------
// 「編集」タスクは開始/完了ではなく、5段階の進捗を数直線上のバーで手動管理する。
// 段階を動かしてもスケジューラの配置には影響しない(見積・残りは今まで通り1つのまま)。
var STAGE_LABELS = ['カット', 'テロップ', '演出・画角', '言い回し調整', '最終確認'];

function renderStageDots(value) {
  var wrap = document.getElementById('stageDots');
  wrap.innerHTML = '';
  STAGE_LABELS.forEach(function (_, i) {
    var dot = document.createElement('span');
    if (i <= value) dot.className = 'filled';
    wrap.appendChild(dot);
  });
  document.getElementById('stageLabel').textContent = STAGE_LABELS[value];
}

function openDetail(taskId) {
  var task = state.tasks.find(function (t) { return t.id === taskId; });
  if (!task) return;
  state.activeTaskId = taskId;
  document.getElementById('detailTitle').textContent = task.title;
  document.getElementById('detailBody').textContent = task.detail || '(詳細は登録されていません)';
  document.getElementById('detailReceived').textContent = task.receivedAt ? fmtDate(task.receivedAt) : '不明';
  document.getElementById('detailNumbers').textContent =
    '見積' + task.estimateMinutes + '分 / 残り' + task.remainingMinutes + '分 / 期限' + (task.deadline || 'なし');
  document.getElementById('detailSource').textContent = task.sourceUrl || task.source || '';
  document.getElementById('qaAnswer').hidden = true;
  document.getElementById('qaInput').value = '';

  var isDone = task.status === '完了';
  var isEdit = task.kind === '編集';
  document.getElementById('bringBackRow').hidden = isDone || !(task.notBefore && task.notBefore > todayKey());
  document.getElementById('simpleActions').hidden = isDone || isEdit;
  document.getElementById('editActions').hidden = isDone || !isEdit;
  if (isEdit && !isDone) {
    var stage = task.editStage || 0;
    document.getElementById('stageSlider').value = stage;
    renderStageDots(stage);
  }
  openSheet('detailSheet');
}

document.getElementById('bringBackBtn').addEventListener('click', function () {
  updateActiveTask({ notBefore: null });
});
var confirmCallback = null;
function showConfirm(message, onOk) {
  confirmCallback = onOk;
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('sheetBackdrop').hidden = false;
  document.getElementById('confirmSheet').hidden = false;
}
function hideConfirm_() {
  document.getElementById('confirmSheet').hidden = true;
}
document.getElementById('confirmCancelBtn').addEventListener('click', function () {
  confirmCallback = null;
  hideConfirm_();
});
document.getElementById('confirmOkBtn').addEventListener('click', function () {
  var cb = confirmCallback;
  confirmCallback = null;
  hideConfirm_();
  if (cb) cb();
});
document.getElementById('deleteTaskBtn').addEventListener('click', function () {
  showConfirm('このタスクを削除します。元に戻せません。よろしいですか？', function () {
    callApi('deleteTaskApi', { id: state.activeTaskId })
      .then(function () { closeSheet('detailSheet'); return refreshAll(); })
      .catch(function (err) { showToast(String(err.message || err)); });
  });
});
document.getElementById('startTaskBtn').addEventListener('click', function () {
  updateActiveTask({ status: '進行中' });
});
document.getElementById('completeTaskBtn').addEventListener('click', function () {
  completeActiveTask();
});
document.getElementById('finishEditBtn').addEventListener('click', function () {
  completeActiveTask();
});
document.getElementById('deferTaskBtn').addEventListener('click', function () {
  deferActiveTask();
});
document.getElementById('deferEditBtn').addEventListener('click', function () {
  deferActiveTask();
});
document.getElementById('stageSlider').addEventListener('input', function (e) {
  renderStageDots(Number(e.target.value));
});
document.getElementById('stageSlider').addEventListener('change', function (e) {
  var stage = Number(e.target.value);
  callApi('updateTaskApi', { id: state.activeTaskId, patch: { editStage: stage, status: stage > 0 ? '進行中' : '未着手' } })
    .then(function () { return refreshAll(); })
    .catch(function (err) { showToast(String(err.message || err)); });
});
function completeActiveTask() {
  updateActiveTask({ status: '完了', remainingMinutes: 0 });
}
function deferActiveTask() {
  updateActiveTask({ status: '未着手', notBefore: addDaysKey(todayKey(), 1) });
}
function updateActiveTask(patch) {
  callApi('updateTaskApi', { id: state.activeTaskId, patch: patch })
    .then(function () { closeSheet('detailSheet'); return refreshAll(); })
    .catch(function (err) { showToast(String(err.message || err)); });
}

document.getElementById('qaAskBtn').addEventListener('click', function () {
  var q = document.getElementById('qaInput').value.trim();
  if (!q) return;
  callApi('answerQuestion', { taskId: state.activeTaskId, question: q })
    .then(function (res) {
      var el = document.getElementById('qaAnswer');
      el.hidden = false;
      el.textContent = res.answer;
    })
    .catch(function (err) { showToast(String(err.message || err)); });
});

// ---------- 追加シート ----------
document.getElementById('fabAdd').addEventListener('click', function () {
  document.getElementById('addText').value = '';
  document.getElementById('pvDeadline').value = '';
  state.addPriority = 3;
  state.addCategory = (state.settings.categories[0] || {}).key || null;
  state.addKind = '';
  state.addWeight = 'medium';
  renderAddChips();
  openSheet('addSheet');
});
document.getElementById('micButton').addEventListener('click', toggleVoice);
document.getElementById('cancelAddBtn').addEventListener('click', function () {
  closeSheet('addSheet');
});

var parseDebounce = null;
document.getElementById('addText').addEventListener('input', function (e) {
  clearTimeout(parseDebounce);
  parseDebounce = setTimeout(function () { previewParse(e.target.value); }, 250);
});

function previewParse(text) {
  if (!text.trim()) return;
  callApi('parseTaskText', { text: text }).then(function (parsed) {
    state.parsed = parsed;
    document.getElementById('pvDeadline').value = parsed.deadline || '';
    state.addPriority = parsed.priority;
    if (parsed.estimateMinutes) state.addWeight = weightTier(parsed.estimateMinutes);
    renderAddChips();
  });
}

// 見積は分単位で打たせず、重さ3段階のどれかを選ぶだけにする。実際の分数は
// 内部で代表値に変換する(今日タブの重さドットと同じ境界に合わせてある)。
var WEIGHT_MINUTES = { light: 15, medium: 40, heavy: 90 };
var WEIGHT_LABELS = { light: '軽い', medium: '普通', heavy: '重い' };

function renderAddChips() {
  var wWrap = document.getElementById('weightChips');
  wWrap.innerHTML = '';
  ['light', 'medium', 'heavy'].forEach(function (w) {
    var chip = document.createElement('button');
    chip.className = 'chip' + (state.addWeight === w ? ' active' : '');
    chip.textContent = WEIGHT_LABELS[w];
    chip.addEventListener('click', function () { state.addWeight = w; renderAddChips(); });
    wWrap.appendChild(chip);
  });

  var pWrap = document.getElementById('priorityChips');
  pWrap.innerHTML = '';
  [[1, '最優先'], [2, '急ぎ'], [3, '通常'], [4, 'いつでも']].forEach(function (p) {
    var chip = document.createElement('button');
    chip.className = 'chip' + (state.addPriority === p[0] ? ' active' : '');
    chip.textContent = p[1];
    chip.addEventListener('click', function () { state.addPriority = p[0]; renderAddChips(); });
    pWrap.appendChild(chip);
  });

  var cWrap = document.getElementById('addCategoryChips');
  cWrap.innerHTML = '';
  (state.settings.categories || []).forEach(function (cat) {
    var chip = document.createElement('button');
    chip.className = 'chip' + (state.addCategory === cat.key ? ' active' : '');
    chip.textContent = cat.label;
    chip.addEventListener('click', function () { state.addCategory = cat.key; renderAddChips(); });
    cWrap.appendChild(chip);
  });

  var kWrap = document.getElementById('kindChips');
  kWrap.innerHTML = '';
  [['', '通常'], ['編集', '編集']].forEach(function (k) {
    var chip = document.createElement('button');
    chip.className = 'chip' + (state.addKind === k[0] ? ' active' : '');
    chip.textContent = k[1];
    chip.addEventListener('click', function () { state.addKind = k[0]; renderAddChips(); });
    kWrap.appendChild(chip);
  });
}

document.getElementById('saveAddBtn').addEventListener('click', function () {
  stopVoiceInput();
  var text = document.getElementById('addText').value.trim();
  if (!text) {
    showToast('タイトルは必須です');
    return;
  }
  callApi('createTaskDirect', {
    title: (state.parsed && state.parsed.title) || text,
    estimateMinutes: WEIGHT_MINUTES[state.addWeight],
    deadline: document.getElementById('pvDeadline').value || null,
    priority: state.addPriority,
    category: state.addCategory,
    kind: state.addKind,
    source: '手入力',
  }).then(function () {
    closeSheet('addSheet');
    return refreshAll();
  }).catch(function (err) { showToast(String(err.message || err)); });
});

function onVoiceResult(text) {
  document.getElementById('addText').value = text;
  previewParse(text);
}

// ---------- シート開閉 ----------
function openSheet(id) {
  document.getElementById('sheetBackdrop').hidden = false;
  document.getElementById(id).hidden = false;
}
function closeSheet(id) {
  document.getElementById('sheetBackdrop').hidden = true;
  document.getElementById(id).hidden = true;
}
document.getElementById('sheetBackdrop').addEventListener('click', function () {
  stopVoiceInput();
  closeSheet('addSheet');
  closeSheet('detailSheet');
  hideConfirm_();
  confirmCallback = null;
});

// ---------- 設定タブ ----------
function renderSettingsForm() {
  var s = state.settings;
  document.getElementById('setMinBlock').value = s.minBlock;
  document.getElementById('setMaxBlock').value = s.maxBlock;
  document.getElementById('setBreakMin').value = s.breakMin;
  document.getElementById('setBufferMin').value = s.bufferMin;
  document.getElementById('setLookahead').value = s.lookaheadDays;
  document.getElementById('setReadCalendars').value = (s.readCalendarIds || []).join(',');
  document.getElementById('setWriteCalendar').value = s.writeCalendarId || '';
  document.getElementById('setIgnoredCalendars').value = (s.ignoredCalendarIds || []).join(',');
  document.getElementById('setIgnoredTitles').value = (s.ignoredTitlePatterns || []).join(',');

  var wrap = document.getElementById('categoryEditList');
  wrap.innerHTML = '';
  (s.categories || []).forEach(function (cat, i) {
    var row = document.createElement('div');
    row.className = 'category-edit-row';
    row.innerHTML =
      '<input type="color" value="' + cat.color + '" data-idx="' + i + '" class="cat-color">' +
      '<input type="text" value="' + escapeHtml(cat.label) + '" data-idx="' + i + '" class="cat-label">';
    wrap.appendChild(row);
  });
}

document.getElementById('saveSettingsBtn').addEventListener('click', function () {
  var categories = (state.settings.categories || []).map(function (cat, i) {
    var labelInput = document.querySelector('.cat-label[data-idx="' + i + '"]');
    var colorInput = document.querySelector('.cat-color[data-idx="' + i + '"]');
    return { key: cat.key, label: labelInput ? labelInput.value : cat.label, color: colorInput ? colorInput.value : cat.color };
  });
  var patch = {
    minBlock: Number(document.getElementById('setMinBlock').value),
    maxBlock: Number(document.getElementById('setMaxBlock').value),
    breakMin: Number(document.getElementById('setBreakMin').value),
    bufferMin: Number(document.getElementById('setBufferMin').value),
    lookaheadDays: Number(document.getElementById('setLookahead').value),
    readCalendarIds: splitCsv(document.getElementById('setReadCalendars').value),
    writeCalendarId: document.getElementById('setWriteCalendar').value.trim(),
    ignoredCalendarIds: splitCsv(document.getElementById('setIgnoredCalendars').value),
    ignoredTitlePatterns: splitCsv(document.getElementById('setIgnoredTitles').value),
    categories: categories,
  };
  callApi('saveSettingsApi', patch).then(function (s) {
    state.settings = s;
    showToast('設定を保存しました');
    return refreshAll();
  }).catch(function (err) { showToast(String(err.message || err)); });
});

function splitCsv(v) {
  return v.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
}

document.getElementById('connectBtn').addEventListener('click', function () {
  var code = document.getElementById('connectionCode').value.trim();
  try {
    var conn = JSON.parse(atob(code));
    if (!conn.url) throw new Error('invalid');
    setConnection(conn);
    document.getElementById('connectionStatus').textContent = '接続情報を保存しました。確認中...';
    callApi('ping', {}).then(function () {
      document.getElementById('connectionStatus').textContent = '接続できました';
      return refreshAll();
    }).catch(function (err) {
      document.getElementById('connectionStatus').textContent = '接続に失敗しました: ' + (err.message || err);
    });
  } catch (e) {
    document.getElementById('connectionStatus').textContent = '接続コードの形式が正しくありません';
  }
});

function getConnection() {
  try { return JSON.parse(localStorage.getItem('dp_connection') || 'null'); } catch (e) { return null; }
}
function setConnection(conn) {
  localStorage.setItem('dp_connection', JSON.stringify(conn));
}

// ---------- 全体更新 ----------
function refreshAll() {
  return Promise.all([callApi('getSettingsApi', {}), callApi('listTasksApi', {}), callApi('generateSchedule', {})])
    .then(function (results) {
      state.settings = results[0];
      state.tasks = results[1];
      state.schedule = results[2];
      renderWarnings();
      renderSchedule();
      renderCategoryChips();
      renderTasks();
      renderSettingsForm();
    });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

if (IS_PWA_BUILD && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}

refreshAll().catch(function (err) { showToast('読み込みに失敗しました: ' + (err.message || err)); });
setInterval(function () { if (state.tab === 'today' && state.schedule) renderSchedule(); }, 60000);
</script>
