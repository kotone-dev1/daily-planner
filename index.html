<!--
  画面の正。ここだけを編集する。
  build/build.mjs が @if:gas / @if:web / @inject:core を畳んで
  dist/gas/index.html と dist/web/index.html を生成する。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Daily Planner</title>

<link rel="manifest" href="./manifest.webmanifest">

<style>
  /* 黒だけで作る。明るいテーマは持たない（本人の指定）。
     端末が明るい設定でも黒のまま出るよう、色は必ずここのトークンから取る。 */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --row: #131315;
    --row-2: #1C1C1E;
    --sep: #2C2C2E;
    --text: #FFFFFF;
    --text-2: #98989F;
    --text-3: #5E5E63;
    --accent: #FF9F0A;
    --accent-dim: rgba(255, 159, 10, .18);
    --danger: #FF453A;
    --cat-1: #0A84FF;
    --cat-2: #30D158;
    --cat-3: #BF5AF2;
    --radius: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; padding: 0; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- 骨組み ---------- */
  .app { display: flex; flex-direction: column; min-height: 100%; }
  .scroll {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }
  .view[hidden] { display: none; }

  .head {
    padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
    display: flex; align-items: flex-end; gap: 12px;
  }
  .head h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .head .sub { margin-left: auto; font-size: 15px; color: var(--text-2); padding-bottom: 6px; }
  .head h1 { font-size: 30px; }
  .daytag {
    font-size: 13px; color: #000; background: var(--accent);
    border-radius: 5px; padding: 1px 7px; margin-bottom: 8px;
  }
  .daytag:empty { display: none; }
  .planbtn {
    display: block; width: calc(100% - 32px); margin: 4px 16px 8px;
    min-height: 44px; border-radius: var(--radius);
    background: var(--row); color: var(--accent); font-size: 15px; font-weight: 600;
  }
  .backrow { padding: calc(6px + env(safe-area-inset-top)) 12px 0; }
  .backrow button {
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 44px; padding: 0 4px; color: var(--accent); font-size: 17px;
  }

  .progress {
    height: 2px; background: var(--accent); width: 0;
    transition: width .4s ease; opacity: 0;
  }
  .progress.on { width: 70%; opacity: 1; }

  /* ---------- グループ ---------- */
  .group-title {
    padding: 22px 20px 6px; font-size: 13px; color: var(--text-2);
    letter-spacing: .01em;
  }
  .group {
    margin: 0 16px; background: var(--row);
    border-radius: var(--radius); overflow: hidden;
  }
  .group + .group { margin-top: 12px; }

  .cell {
    position: relative; display: block; width: 100%;
    background: var(--row); text-align: left;
    min-height: 48px;
  }
  .cell + .cell .inner::before {
    content: ""; position: absolute; left: 16px; right: 0; top: 0;
    height: 1px; background: var(--sep);
  }
  .inner {
    position: relative; display: grid; align-items: center; gap: 12px;
    grid-template-columns: 52px minmax(0, 1fr) auto;
    padding: 10px 14px 10px 16px; min-height: 48px;
    background: var(--row);
    transition: transform .22s cubic-bezier(.32, .72, 0, 1);
  }
  .inner.plain { grid-template-columns: minmax(0, 1fr) auto; }
  .cell .time { font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .cell .title { font-size: 17px; overflow-wrap: anywhere; }
  .cell .meta { font-size: 13px; color: var(--text-2); }
  .cell .right { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 15px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--cat, var(--text-3)); }

  .cell.event .inner { background: var(--row-2); }
  .cell.event .title { color: var(--text-2); }
  .cell.past .inner { opacity: .45; }
  /* 期限のないものは、締切ぶんと同じ濃さで出さない。
     全部が同じ見た目だと「今日やらないとまずいもの」が埋もれる。 */
  .cell.loose .title { color: var(--text-2); }
  .cell.loose .dot { opacity: .5; }
  .cell.running .title { color: var(--accent); }

  /* いまの時刻 */
  .nowline {
    display: grid; grid-template-columns: 52px minmax(0, 1fr);
    gap: 12px; align-items: center; padding: 0 14px 0 16px;
    background: var(--row);
  }
  .nowline .t { font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .nowline .l { height: 2px; background: var(--accent); border-radius: 1px; }

  /* ---------- スワイプで削除 ---------- */
  .cell.swipe { overflow: hidden; }
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0;
    display: flex; align-items: stretch;
  }
  .swipe-actions button {
    width: 88px; color: #FFFFFF; font-size: 15px; font-weight: 600;
  }
  .swipe-actions .done { background: var(--cat-2); }
  .swipe-actions .del { background: var(--danger); }
  .cell.open .inner { transform: translateX(-176px); }

  /* ---------- 大きなボタン ---------- */
  .bigbtn {
    display: block; width: calc(100% - 32px); margin: 16px;
    min-height: 50px; border-radius: var(--radius);
    background: var(--row); color: var(--accent);
    font-size: 17px; font-weight: 600;
  }
  .bigbtn.filled { background: var(--accent); color: #000000; }
  .bigbtn[disabled] { opacity: .35; }

  .chips { display: flex; gap: 8px; padding: 8px 16px 4px; }
  .chip {
    min-height: 34px; padding: 6px 14px; border-radius: 17px;
    background: var(--row); color: var(--text-2); font-size: 15px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #000000; }

  .empty { padding: 48px 24px; text-align: center; color: var(--text-2); font-size: 15px; }
  .banner {
    margin: 8px 16px 0; padding: 10px 14px; border-radius: var(--radius);
    background: var(--row); color: var(--text-2); font-size: 13px;
  }
  .banner[hidden] { display: none; }

  /* ---------- 警告 ---------- */
  .alert-cell .inner { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .alert-cell .title { color: var(--text); }
  .alert-cell .meta { color: var(--danger); }
  .alert-icon { color: var(--danger); display: block; }

  /* ---------- タブ ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--sep);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button { min-height: 54px; font-size: 12px; color: var(--text-3); }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .fab {
    position: fixed; right: 16px; z-index: 5;
    bottom: calc(70px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 28px;
    background: var(--accent); color: #000000;
    font-size: 30px; font-weight: 400; line-height: 1;
    box-shadow: 0 6px 20px -6px rgba(0, 0, 0, .7);
  }

  /* ---------- シート ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .5); }
  .backdrop[hidden] { display: none; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--bg);
    border-radius: 14px 14px 0 0;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    animation: rise 260ms cubic-bezier(.32, .72, 0, 1);
  }
  .sheet[hidden] { display: none; }
  @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .inner { transition: none; }
  }
  .grabber {
    width: 36px; height: 5px; border-radius: 3px; background: var(--sep);
    margin: 8px auto 4px;
  }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px 10px;
  }
  .sheet-head .t { font-size: 17px; font-weight: 600; }
  .sheet-head button { min-height: 44px; color: var(--accent); font-size: 17px; }

  .catch { padding: 4px 16px 0; }
  .catch input {
    width: 100%; background: var(--row); border: none; color: var(--text);
    border-radius: var(--radius); padding: 14px; min-height: 52px; font-size: 17px;
  }
  .parsed { padding: 8px 20px 0; font-size: 13px; color: var(--text-2); min-height: 20px; }
  .catch textarea {
    width: 100%; background: var(--row); border: none; color: var(--text);
    border-radius: var(--radius); padding: 14px; font-size: 17px;
    line-height: 1.6; resize: none; font-family: inherit;
  }
  .kind-badge {
    display: inline-block; text-align: center;
    font-size: 12px; color: var(--text-2);
    border: 1px solid var(--sep); border-radius: 5px; padding: 2px 0;
  }
  .mic {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 12px 16px 0; width: calc(100% - 32px);
    min-height: 50px; border-radius: var(--radius);
    background: var(--row); color: var(--accent); font-size: 17px;
  }
  .mic[data-listening="true"] { background: var(--accent-dim); color: var(--danger); }
  .msg { padding: 8px 20px 0; font-size: 13px; color: var(--danger); min-height: 18px; }

  .field {
    display: grid; grid-template-columns: 72px minmax(0, 1fr);
    gap: 12px; align-items: center; padding: 0 16px;
    min-height: 52px; background: var(--row);
  }
  .fields { margin: 12px 16px 0; border-radius: var(--radius); overflow: hidden; }
  .fields .field + .field { border-top: 1px solid var(--sep); }
  .field label { font-size: 15px; color: var(--text-2); }
  .field input, .field select {
    background: none; border: none; padding: 12px 0; min-height: 48px;
    width: 100%; text-align: right; font-size: 17px;
  }
  .field select { text-align-last: right; }

  .detail-facts { margin: 12px 16px 0; border-radius: var(--radius); overflow: hidden; background: var(--row); }
  .fact { padding: 10px 16px; }
  .fact + .fact { border-top: 1px solid var(--sep); }
  .fact dt { font-size: 13px; color: var(--text-2); }
  .fact dd { margin: 2px 0 0; font-size: 17px; overflow-wrap: anywhere; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; }
  .actions button {
    min-height: 50px; border-radius: var(--radius);
    background: var(--row); color: var(--accent); font-size: 17px; font-weight: 600;
  }
  .actions button.filled { background: var(--accent); color: #000000; }
  .actions button.danger { color: var(--danger); }
</style>

<div class="app">
  <div class="progress" id="progress"></div>

  <div class="scroll" id="scroll">
    <!-- 今日 / ある1日 -->
    <section class="view" id="viewDay">
      <div class="backrow" id="backRow" hidden>
        <button type="button" id="backBtn">‹ これから</button>
      </div>

        <span class="daytag" id="daySub"></span>

</div>

<button class="fab" id="fab" type="button" aria-label="タスクを追加">+</button>

<nav class="tabbar">

  <button type="button" data-tab="settings">設定</button>
</nav>

<!-- 追加：まとめて喋って、勝手に仕分ける -->

  <div class="sheet-head">
    <span class="t" id="addStageTitle">追加</span>
    <button type="button" id="addCancel">キャンセル</button>
  </div>

    <div class="catch">
      <textarea id="catchInput" rows="4" placeholder="溜まってるものを続けて言ってください&#10;例）今日中に、カット90分、テロップ60分。あと毎日アポ5件"></textarea>

    <button class="mic" type="button" id="micBtn" data-listening="false">

      </svg>
      <span id="micLabel">話して追加</span>

    <div class="msg" id="addMsg"></div>
    <button class="bigbtn filled" id="toReview" type="button" disabled>仕分ける</button>
  </div>

    <div id="reviewList"></div>

    <button class="bigbtn filled" id="saveAll" type="button">まとめて保存</button>
    <button class="bigbtn" id="backToSpeak" type="button">言い直す</button>

</div>

<script>
/**
 * 一言テキストを タイトル / 見積分 / 期限 / 優先度 に分解し、
 * さらに**どの形の仕事か**（1回型 / 目標 / 日課 / 案件）を見分ける。
 *
 * 外部依存なし・現在時刻は引数で受け取る（GAS と Node のテストで同じファイルを使う）。
 * 分類の語や工程の型は、設定や履歴から呼び出し側が options で渡す。
 * ここに埋め込むと、語が増えるたびに解析器を書き換えることになるため。
 */
"use strict";

var DP_PARSER = (function () {
  var HALF_DAY_MIN = 240;
  var DEFAULT_PRIORITY = 3;
  var WEEKDAYS = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 };

  var KANJI_DIGITS = { 〇: 0, 零: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };

  /**
   * 「十時」「二十人」「九十分」のような漢数字を半角に直す。
   * 音声認識が数字を漢字で返すことがあり、そのままだと解析が丸ごと外れるため。
   * 扱うのは99までの素直な形だけ（百以上や「四半期」のような語は触らない）。
   */
  function kanjiToNumber(text) {
    return text.replace(/[〇零一二三四五六七八九十]+/g, function (chunk) {
      if (chunk === "十") return "10";
      var tens = chunk.indexOf("十");
      if (tens < 0) {
        var digits = "";
        for (var i = 0; i < chunk.length; i++) {
          if (KANJI_DIGITS[chunk.charAt(i)] === undefined) return chunk;
          digits += KANJI_DIGITS[chunk.charAt(i)];
        }
        return digits;
      }
      var head = chunk.slice(0, tens);
      var tail = chunk.slice(tens + 1);
      if (head.length > 1 || tail.length > 1) return chunk;
      var value = (head === "" ? 1 : KANJI_DIGITS[head]) * 10 + (tail === "" ? 0 : KANJI_DIGITS[tail]);
      return isFinite(value) ? String(value) : chunk;
    });
  }

  function normalize(text) {
    return kanjiToNumber(
      String(text == null ? "" : text)
        .replace(/[０-９]/g, function (c) {
          return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
        })
        .replace(/　/g, " ")
        .replace(/[：]/g, ":")
    );
  }

  function ymd(d) {
    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  function startOfDay(now) {
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function shift(base, days) {
    var d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
    d.setDate(d.getDate() + days);
    return d;
  }

  /** その週の月曜。週は月曜はじまり。 */
  function mondayOf(base) {
    return shift(base, -((base.getDay() + 6) % 7));
  }

  /** 月曜起点の週内オフセット（月=0 … 日=6）。 */
  function weekOffset(jsDay) {
    return (jsDay + 6) % 7;
  }

  /** その月の末日。過ぎていれば翌年に送る。 */
  function endOfMonth(today, monthIndex) {
    var d = new Date(today.getFullYear(), monthIndex + 1, 0);
    if (d < today) d = new Date(today.getFullYear() + 1, monthIndex + 1, 0);
    return d;
  }

  // 「金曜まで」「今日中に」「来週までに」——期限の後ろに付く言い回しをまとめて食う。
  var UNTIL = "(?:(?:まで|中)(?:に)?)?";

  /** 先に当たったものが勝つ。長い表現を先に置くこと。 */
  var ESTIMATE_RULES = [
    [/(\d+)\s*時間\s*(\d+)\s*分/, function (m) { return Number(m[1]) * 60 + Number(m[2]); }],
    [/(\d+)\s*時間半/, function (m) { return Number(m[1]) * 60 + 30; }],
    [/(\d+)\s*時間/, function (m) { return Number(m[1]) * 60; }],
    [/半日/, function () { return HALF_DAY_MIN; }],
    [/(\d+)\s*分/, function (m) { return Number(m[1]); }]
  ];

  var PRIORITY_RULES = [
    [/最優先/, 1],
    [/至急|急ぎ/, 2],
    [/通常/, 3],
    [/いつでも/, 4]
  ];

  function dueRules(today) {
    return [
      [new RegExp("今日" + UNTIL), function () { return today; }],
      [new RegExp("明後日" + UNTIL), function () { return shift(today, 2); }],
      [new RegExp("明日" + UNTIL), function () { return shift(today, 1); }],
      [new RegExp("今月末" + UNTIL), function () {
        return new Date(today.getFullYear(), today.getMonth() + 1, 0);
      }],
      [new RegExp("(\\d+)\\s*日後" + UNTIL), function (m) {
        return shift(today, Number(m[1]));
      }],
      [new RegExp("来週の?([月火水木金土日])曜?日?" + UNTIL), function (m) {
        return shift(mondayOf(today), 7 + weekOffset(WEEKDAYS[m[1]]));
      }],
      [new RegExp("今週の?([月火水木金土日])曜?日?" + UNTIL), function (m) {
        return shift(mondayOf(today), weekOffset(WEEKDAYS[m[1]]));
      }],
      // 曜日を言わない「来週まで」は1週間後、「今週中」は今週の日曜。
      [new RegExp("来週" + UNTIL), function () { return shift(today, 7); }],
      [new RegExp("今週" + UNTIL), function () { return shift(mondayOf(today), 6); }],
      // 「10月末」も「11月まで」も、その月の末日として扱う。
      [new RegExp("(\\d{1,2})\\s*月末" + UNTIL), function (m) {
        return endOfMonth(today, Number(m[1]) - 1);
      }],
      [new RegExp("(\\d{1,2})\\s*月\\s*(?:まで(?:に)?|をめど|目処)"), function (m) {
        return endOfMonth(today, Number(m[1]) - 1);
      }],
      // 「10/10」「10.10」「2027/1/5」。打つときはこの形が多い。
      [new RegExp("(\\d{4})[/.\\-](\\d{1,2})[/.\\-](\\d{1,2})" + UNTIL), function (m) {
        return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      }],
      [new RegExp("(?:^|[^\\d:])(\\d{1,2})[/.](\\d{1,2})(?![\\d:])" + UNTIL), function (m) {
        var month = Number(m[1]) - 1;
        var day = Number(m[2]);
        var d = new Date(today.getFullYear(), month, day);
        if (d < today) d = new Date(today.getFullYear() + 1, month, day);
        return d;
      }],
      [new RegExp("(\\d+)\\s*月\\s*(\\d+)\\s*日" + UNTIL), function (m) {
        var month = Number(m[1]) - 1;
        var day = Number(m[2]);
        var d = new Date(today.getFullYear(), month, day);
        if (d < today) d = new Date(today.getFullYear() + 1, month, day);
        return d;
      }],
      [new RegExp("([月火水木金土日])曜日?" + UNTIL), function (m) {
        return shift(today, (WEEKDAYS[m[1]] - today.getDay() + 7) % 7);
      }]
    ];
  }

  /** 最初に当たった規則の値を返し、当たった箇所を空白に置き換えた文字列も返す。 */
  function takeFirst(text, rules) {
    for (var i = 0; i < rules.length; i++) {
      var m = text.match(rules[i][0]);
      if (!m) continue;
      var value = typeof rules[i][1] === "function" ? rules[i][1](m) : rules[i][1];
      return { value: value, rest: text.replace(rules[i][0], " ") };
    }
    return { value: null, rest: text };
  }

  // 喋ったときに付く言い回し。題に残ると邪魔なので落とす。
  var FILLER = /(?:溜ま|たま)(?:って|った)(?:る|いる)?|残って(?:る|いる)?|あるのが|ぶん(?=$|\s)/g;

  function cleanTitle(text) {
    var t = String(text)
      .replace(FILLER, " ")
      .replace(/(?:が|は|を|の|で)\s*$/, " ")
      .replace(/\s+/g, " ")
      .replace(/^[\s、。・,.\-–—:：]+/, "")
      .replace(/[\s、。・,.\-–—:：]+$/, "")
      .trim();
    return t === "" ? null : t;
  }

  /* ---------- 形の見分けに使う語 ---------- */

  // 数えられる単位。ここに無いものは数量として扱わない（「第3章」「本を読む」を守る）。
  var COUNT_UNITS = "人|件|本|回|冊|記事|動画|杯";

  var WEEKDAY_CHARS = "月火水木金土日";

  /** 「1件90分」「1人あたり90分」のような、1件あたりの見積。 */
  var PER_ITEM_RULES = [
    [new RegExp("1\\s*(?:" + COUNT_UNITS + ")\\s*(?:あたり|につき)?\\s*(\\d+)\\s*時間\\s*(\\d+)\\s*分"),
      function (m) { return Number(m[1]) * 60 + Number(m[2]); }],
    [new RegExp("1\\s*(?:" + COUNT_UNITS + ")\\s*(?:あたり|につき)?\\s*(\\d+)\\s*時間半"),
      function (m) { return Number(m[1]) * 60 + 30; }],
    [new RegExp("1\\s*(?:" + COUNT_UNITS + ")\\s*(?:あたり|につき)?\\s*(\\d+)\\s*時間"),
      function (m) { return Number(m[1]) * 60; }],
    [new RegExp("1\\s*(?:" + COUNT_UNITS + ")\\s*(?:あたり|につき)?\\s*(\\d+)\\s*分"),
      function (m) { return Number(m[1]); }]
  ];

  /** 「現在7人」「7人済み」のような、すでに済んでいる数。 */
  var CURRENT_RULES = [
    [new RegExp("(?:現在|いま|すでに)\\s*(\\d+)\\s*(?:" + COUNT_UNITS + ")?"), function (m) { return Number(m[1]); }],
    [new RegExp("(\\d+)\\s*(?:" + COUNT_UNITS + ")\\s*(?:済み|済|完了|終わり)"), function (m) { return Number(m[1]); }]
  ];

  function cadenceRules() {
    return [
      [/平日/, function () { return { per: "day", weekdays: [1, 2, 3, 4, 5] }; }],
      [new RegExp("毎週\\s*の?\\s*([" + WEEKDAY_CHARS + "]+)\\s*曜?日?"), function (m) {
        var out = [];
        for (var i = 0; i < m[1].length; i++) {
          var index = WEEKDAY_CHARS.indexOf(m[1].charAt(i));
          var jsDay = index === 6 ? 0 : index + 1; // 月=1 … 土=6 / 日=0
          if (out.indexOf(jsDay) < 0) out.push(jsDay);
        }
        out.sort(function (a, b) { return a - b; });
        return { per: "day", weekdays: out };
      }],
      [/毎日|毎朝|毎晩|毎夜|日課/, function () { return { per: "day", weekdays: [] }; }],
      // 「週3本」。数量そのものは後段の takeQuantity に残す。
      [new RegExp("(?:毎週|週)(?=\\s*\\d+\\s*(?:" + COUNT_UNITS + "))"), function () {
        return { per: "week", weekdays: [] };
      }],
      [/毎週/, function () { return { per: "week", weekdays: [] }; }]
    ];
  }

  /** 数量と単位。単位の直前に数字があるときだけ拾う。 */
  function takeQuantity(text) {
    var re = new RegExp("(\\d+)\\s*(" + COUNT_UNITS + ")");
    var m = text.match(re);
    if (!m) return { value: null, unit: null, rest: text };
    return { value: Number(m[1]), unit: m[2], rest: text.replace(re, " ") };
  }

  /** 工程の型。呼び出し側が渡した名前だけを見る。 */
  function takeProjectType(text, types) {
    if (!types || !types.length) return { value: null, rest: text };
    var longest = types.slice().sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < longest.length; i++) {
      var name = String(longest[i]);
      if (name && text.indexOf(name) >= 0) {
        return { value: name, rest: text.replace(name, " ") };
      }
    }
    return { value: null, rest: text };
  }

  /** 分類。呼び出し側が渡した語だけを見る。当たらなければ null。 */
  function guessCategory(text, hints) {
    if (!hints) return null;
    var lower = text.toLowerCase();
    for (var name in hints) {
      if (!Object.prototype.hasOwnProperty.call(hints, name)) continue;
      var words = hints[name] || [];
      for (var i = 0; i < words.length; i++) {
        if (words[i] && lower.indexOf(String(words[i]).toLowerCase()) >= 0) return name;
      }
    }
    return null;
  }

  /* ---------- 言葉から所要時間を決める（人に聞かない） ---------- */

  var FALLBACK_ESTIMATE = 30;

  /** 「工程名=分」をカンマで並べた表を読む。設定から渡される。 */
  function parseEstimateTable(spec) {
    var table = [];
    String(spec || "").split(/[,、|]/).forEach(function (pair) {
      var kv = pair.split("=");
      if (kv.length !== 2) return;
      var word = kv[0].trim();
      var minutes = Number(kv[1]);
      if (word && isFinite(minutes) && minutes > 0) table.push([word, minutes]);
    });
    // 長い語を先に当てる（「素材取り込み」が「素材」に食われないように）
    table.sort(function (a, b) { return b[0].length - a[0].length; });
    return table;
  }

  /**
   * 題から所要時間を決める。分からなければ 30分。
   * 見積を尋ねる画面を出さないためにあり、外れても実績で直る前提で置いている。
   */
  function estimateBase(text, options) {
    var opts = options || {};
    var table = opts.estimateTable || parseEstimateTable(opts.taskEstimates);
    var body = String(text || "");

    for (var i = 0; i < table.length; i++) {
      if (body.indexOf(table[i][0]) >= 0) return { base: table[i][1], matched: true };
    }
    // 直前の話題を引き継ぐ。「編集が10人分。4が半分」の「4が半分」に
    // 編集の時間を当てるため。無ければ 30分。
    var carried = Number(opts.carryBase);
    return { base: isFinite(carried) && carried > 0 ? carried : FALLBACK_ESTIMATE, matched: false };
  }

  function estimateFor(text, options) {
    var body = String(text || "");
    var found = estimateBase(body, options);
    var ratio = progressRatio(body);
    return roundTo5(found.base * (ratio == null ? 1 : ratio));
  }

  /** 「1〜3」「5から10」のような範囲。何本ぶんかを数える。 */
  var RANGE_RE = /(\d+)\s*(?:〜|~|～|-|から)\s*(\d+)\s*(?:は|が|の)?/;

  /** 「10人分」「3本分」＝ その数だけ溜まっている。 */
  var STOCK_RE = new RegExp("(\\d+)\\s*(?:" + COUNT_UNITS + ")\\s*分(?![0-9])");

  function takeRange(text) {
    var stock = text.match(STOCK_RE);
    if (stock) {
      var n = Number(stock[1]);
      if (n > 0) return { count: Math.min(n, 100), rest: text.replace(STOCK_RE, " ") };
    }
    var m = text.match(RANGE_RE);
    if (!m) return { count: null, rest: text };
    var from = Number(m[1]);
    var to = Number(m[2]);
    if (!(to >= from) || to - from > 200) return { count: null, rest: text };
    return { count: to - from + 1, rest: text.replace(RANGE_RE, " ") };
  }

  /**
   * @param {string} text 一言入力
   * @param {Date} now 現在時刻
   * @param {{projectTypes?: string[], categoryHints?: Object}} [options]
   * @returns {{kind: string, title: string|null, estimateMin: number|null, due: string|null,
   *            priority: number, quantity: number|null, unit: string|null, current: number|null,
   *            perItemMin: number|null, weekdays: number[]|null, projectType: string|null,
   *            category: string|null}}
   */
  function parse(text, now, options) {
    var opts = options || {};
    var today = startOfDay(now instanceof Date ? now : new Date());
    var original = normalize(text);
    var rest = original;

    // 1件あたりの見積を先に抜く。素の見積規則に「1件90分」の90分を食わせないため。
    var range = takeRange(rest);
    rest = range.rest;

    var perItem = takeFirst(rest, PER_ITEM_RULES);
    rest = perItem.rest;

    var cadence = takeFirst(rest, cadenceRules());
    rest = cadence.rest;

    var current = takeFirst(rest, CURRENT_RULES);
    rest = current.rest;

    var quantity = takeQuantity(rest);
    rest = quantity.rest;

    var estimate = takeFirst(rest, ESTIMATE_RULES);
    rest = estimate.rest;

    var priority = takeFirst(rest, PRIORITY_RULES);
    rest = priority.rest;

    var due = takeFirst(rest, dueRules(today));
    rest = due.rest;

    var project = takeProjectType(rest, opts.projectTypes);
    rest = project.rest;

    var estimateMin = estimate.value;
    var perItemMin = perItem.value;
    var dueText = due.value ? ymd(due.value) : null;

    var cadenceValue = cadence.value;
    var kind = "task";
    var needsDue = false;
    if (cadenceValue) kind = "routine";
    else if (quantity.value !== null && quantity.unit) {
      // 期限が無くても目標として返す。1回きりの作業なら確認画面で直せばよい。
      // 黙って1回型のタスクにすると、ノルマが30分の作業として埋もれる。
      kind = "goal";
      needsDue = !dueText;
    } else if (project.value) kind = "project";

    // 数で数える目標・日課で、1件あたりが書かれていなければ、素の見積をそれとみなす。
    // 「取材20件 45分」の45分は合計ではなく1件ぶん、と読むのが自然なため。
    if ((kind === "goal" || kind === "routine") && quantity.value !== null && perItemMin == null && estimateMin != null) {
      perItemMin = estimateMin;
      estimateMin = null;
    }

    var title = cleanTitle(rest);
    var count = range.count || 1;

    // 見積を言わなかったときは、言葉から決める。人に聞かない。
    // 題が無い断片（見出しや尻切れ）には埋めない。置くものが無いため。
    if (title === null) {
      // 何もしない
    } else if ((kind === "goal" || kind === "routine") && quantity.value !== null) {
      if (perItemMin == null) perItemMin = estimateFor(original, opts);
    } else if (estimateMin == null) {
      estimateMin = estimateFor(original, opts) * count;
    } else {
      estimateMin = estimateMin * count;
    }

    return {
      kind: kind,
      title: title,
      count: count,
      estimateMin: estimateMin,
      due: dueText,
      priority: priority.value == null ? DEFAULT_PRIORITY : priority.value,
      quantity: quantity.value,
      unit: quantity.unit,
      current: current.value,
      perItemMin: perItemMin,
      per: cadenceValue ? cadenceValue.per : null,
      weekdays: cadenceValue && cadenceValue.weekdays.length ? cadenceValue.weekdays : null,
      projectType: project.value,
      needsDue: needsDue,
      category: guessCategory(original, opts.categoryHints)
    };
  }

  /* ---------- 喋った塊を項目に割る ---------- */

  /**
   * 区切りには強弱がある。
   *   強い（。改行）… 話が切り替わる。題の無い断片は「ここから先の見出し」
   *   弱い（、あと）… 同じ話の続き。題の無い断片は「直前の項目の補足」
   * この区別が無いと「取材150人、10月末まで」の後半が独立した項目になってしまう。
   */
  function splitFragments(text) {
    var re = /([\n。！!？?]+)|([、,]+)|(そのあと|それから|あとは|あと(?!で)|次に|つぎに|加えて|あわせて)/g;
    var pieces = [];
    var last = 0;
    var sepBefore = null;
    var m;

    while ((m = re.exec(text)) !== null) {
      pieces.push({ text: text.slice(last, m.index), sepBefore: sepBefore });
      sepBefore = m[1] ? "strong" : "weak";
      last = re.lastIndex;
    }
    pieces.push({ text: text.slice(last), sepBefore: sepBefore });

    var out = [];
    var carried = null;
    for (var i = 0; i < pieces.length; i++) {
      var body = pieces[i].text.trim();
      var sep = pieces[i].sepBefore;
      if (carried === "strong" || sep === "strong") sep = "strong";
      else if (carried === "weak" && sep === null) sep = "weak";

      if (body === "") { carried = sep; continue; }
      out.push({ text: body, sepBefore: sep });
      carried = null;
    }
    return out;
  }

  /**
   * 喋った一塊を、複数の項目に分けて返す。
   *
   * タイピングを避けるための入口。項目ごとに形（1回型/目標/日課/案件）と
   * 分類と期限まで見分けるので、あとは確認して保存するだけにできる。
   *
   * @returns {Array} parse() と同じ形のオブジェクトの配列
   */
  function parseMany(text, now, options) {
    var frags = splitFragments(normalize(text));
    var items = [];
    var header = null;

    var carryBase = null;
    var subjectLabel = null;
    var subjectIndex = -1;
    var brokenDown = false;
    var stockTotal = null;

    for (var i = 0; i < frags.length; i++) {
      var frag = frags[i];
      var withCarry = options || {};
      if (carryBase) {
        withCarry = {};
        for (var key in (options || {})) withCarry[key] = options[key];
        withCarry.carryBase = carryBase;
      }
      var result = parse(frag.text, now, withCarry);

      // 「5以降はまっさら」は、総数を知らないと1本になってしまう。
      // 直前に「10人分」と言われていれば、そこから残り本数を数える。
      var tail = frag.text.match(/(\d+)\s*(?:以降|から先|以上)/);
      if (tail && stockTotal) {
        var from = Number(tail[1]);
        if (from >= 1 && from <= stockTotal) {
          var perOne = result.estimateMin && result.count ? result.estimateMin / result.count : result.estimateMin;
          result.count = stockTotal - from + 1;
          if (perOne) result.estimateMin = Math.round(perOne * result.count);
        }
      }
      var matched = estimateBase(frag.text, options || {});
      if (matched.matched) carryBase = matched.base;

      // 見出しは、それを言った文の中だけで効く。
      // 「今日中に、A、B。あとC」の C まで今日にすると、溜まっているだけのものが
      // 今日の締切ものに化けてしまう。
      if (frag.sepBefore === "strong") header = null;

      if (result.title) {
        // 「編集が10人分。1〜3はほぼ完成」——後ろの文は何の話か言わない。
        // 見積は carryBase で引き継げるが、題は引き継がないと
        // 「ほぼ完成で細かい調整」が項目名になってしまう。
        if (matched.matched) {
          subjectLabel = result.title;
          subjectIndex = items.length;
          if (result.count > 1) stockTotal = result.count;
        } else if (subjectLabel) {
          result.title = subjectLabel + " " + result.title;
          brokenDown = true;
        }

        items.push({ raw: frag.text, result: result, header: header });
        // 「今日中にカット、テロップ」のように、期限を最初の項目にくっつけて喋ることが多い。
        // 1回型の期限だけを後ろへ引き継ぐ。目標と日課の期限はそれ自身のものなので引き継がない。
        if (result.due && result.kind === "task") header = result;
        continue;
      }

      // 題が無い断片。強い区切りの後（か先頭）なら見出し、そうでなければ直前の補足。
      var isHeader = items.length === 0 || frag.sepBefore === "strong";
      if (isHeader) {
        if (result.due || result.weekdays) header = result;
      } else {
        var prev = items[items.length - 1];
        prev.raw = prev.raw + " " + frag.text;
        prev.result = parse(prev.raw, now, withCarry);
      }
    }

    // 「10人分」と言った後に内訳（1〜3は…、4は…）を言われたら、
    // 最初の総数はもう別々に数えている。残すと二重に積むことになる。
    if (brokenDown && subjectIndex >= 0 && items[subjectIndex] && items[subjectIndex].result.count > 1) {
      items.splice(subjectIndex, 1);
    }

    return items.map(function (item) {
      var result = item.result;
      if (item.header && !result.due && item.header.due) result.due = item.header.due;
      return result;
    });
  }

  /* ---------- すでに決まっている予定（バイト・授業など） ---------- */

  var CLOCK = "(\\d{1,2})\\s*(?::\\s*(\\d{2})|時\\s*(半)?(?:(\\d{1,2})\\s*分)?)";
  var RANGE_SEP = "\\s*(?:から|〜|～|-|–|ー|to)\\s*";

  function clockMinutes(hour, colonMin, half, min) {
    var h = Number(hour);
    var m = 0;
    if (colonMin !== undefined && colonMin !== "") m = Number(colonMin);
    else if (half) m = 30;
    else if (min !== undefined && min !== "") m = Number(min);
    if (!isFinite(h) || h > 47 || m > 59) return null;
    return h * 60 + m;
  }

  function hhmm(minutes) {
    return String(Math.floor(minutes / 60)).padStart(2, "0") + ":" + String(minutes % 60).padStart(2, "0");
  }

  /**
   * 「バイト 10時から17時」のような、動かせない予定を取り出す。
   * 時刻の幅が読めた断片だけを返す。読めないものはタスク側で扱う。
   */
  function parseFixed(text, now) {
    var frags = splitFragments(normalize(text));
    var rangeRe = new RegExp(CLOCK + RANGE_SEP + CLOCK);
    var durationRe = new RegExp(CLOCK + RANGE_SEP + "(\\d+)\\s*(時間半|時間|分)");
    var out = [];

    for (var i = 0; i < frags.length; i++) {
      var body = frags[i].text;
      var start = null;
      var end = null;
      var consumed = "";

      // 長さの言い方を先に見る。「13時から2時間」の「2時間」を
      // 終わりの時刻（2時）と読み違えないため。
      var d = body.match(durationRe);
      if (d) {
        start = clockMinutes(d[1], d[2], d[3], d[4]);
        var amount = Number(d[5]);
        var span = d[6] === "分" ? amount : d[6] === "時間半" ? amount * 60 + 30 : amount * 60;
        end = start == null ? null : start + span;
        consumed = d[0];
      } else {
        var m = body.match(rangeRe);
        if (m) {
          start = clockMinutes(m[1], m[2], m[3], m[4]);
          end = clockMinutes(m[5], m[6], m[7], m[8]);
          consumed = m[0];
        }
      }

      if (start == null || end == null || end <= start || end > 1440) continue;

      var title = cleanTitle(body.replace(consumed, " "));
      out.push({ title: title || "予定", start: hhmm(start), end: hhmm(end) });
    }
    return out;
  }

  /* ---------- 「N人分溜まってる」をN件に開く ---------- */

  var DEFAULT_ITEM_MIN = 60;
  var MAX_BATCH = 50; // これ以上は現実的に扱えないので打ち切る

  /**
   * 進み具合の言葉を「残っている割合」に落とす。
   * 所要時間を人に入力させないための表。数字を聞き返さないのがこのアプリの要点。
   */
  var PROGRESS_WORDS = [
    [/ほぼ完成|ほぼ終わ|あと少し|あとちょっと|細かい調整|微調整|仕上げだけ|もう少し/, 0.15],
    [/半分|半ば|途中|折り返し/, 0.5],
    [/まっさら|手つかず|手をつけて|これから|まだ何も|ゼロ|未着手/, 1],
    [/(\d+)\s*割\s*(?:終わ|でき|済)/, function (m) { return Math.max(0, 1 - Number(m[1]) / 10); }],
    [/(\d+)\s*%\s*(?:終わ|でき|済)/, function (m) { return Math.max(0, 1 - Number(m[1]) / 100); }]
  ];

  function progressRatio(text) {
    for (var i = 0; i < PROGRESS_WORDS.length; i++) {
      var m = text.match(PROGRESS_WORDS[i][0]);
      if (!m) continue;
      var value = PROGRESS_WORDS[i][1];
      return typeof value === "function" ? value(m) : value;
    }
    return null;
  }

  function roundTo5(minutes) {
    return Math.max(5, Math.round(minutes / 5) * 5);
  }

  /**
   * 「編集が10人分溜まってる。1〜3はほぼ完成、4が半分、5以降はまっさら」を
   * 10件ぶんの下書きに開く。所要時間は言葉から推定し、聞き返さない。
   *
   * @returns {{title, count, unit, items: [{index, label, estimateMin, ratio}]}|null}
   */
  function parseBatch(text, now, options) {
    var opts = options || {};
    var body = normalize(text);

    var countMatch = body.match(new RegExp("(\\d+)\\s*(" + COUNT_UNITS + ")\\s*分?"));
    if (!countMatch) return null;
    var count = Math.min(MAX_BATCH, Number(countMatch[1]));
    if (!(count > 1)) return null;

    // 「毎日アポ5件」のような日課を、まとめ扱いに誤解しないための歯止め。
    // 溜まっている旨か、進み具合の言葉が無ければ、まとめとは見なさない。
    var looksStocked = /溜ま|たま|残って|ストック|分溜|待ち/.test(body);
    if (!looksStocked && progressRatio(body) === null) return null;

    var perItem = takeFirst(body, PER_ITEM_RULES);
    var baseMin = perItem.value || Number(opts.defaultItemMin) || DEFAULT_ITEM_MIN;

    // 題は、件数と進み具合の説明を落とした残り。最初の文だけを見る。
    var head = body.split(/[。\n]/)[0];
    var title = cleanTitle(
      head
        .replace(countMatch[0], " ")
        .replace(/溜ま(って|った)(る|いる)?|たまって(る|いる)?|残って(る|いる)?|ある/g, " ")
        .replace(/が|は|を|の$/g, " ")
    ) || "作業";

    var ratios = [];
    for (var i = 0; i < count; i++) ratios.push(1);

    // 「1〜3は…」「4が…」「5以降は…」を拾って、その範囲だけ塗り替える
    var clauseRe = /(\d+)\s*(?:〜|～|-|–|から)\s*(\d+)|(\d+)\s*(?:以降|から先|以上)|(\d+)/g;
    var clauses = body.split(/[、,。\n]/);
    for (var c = 0; c < clauses.length; c++) {
      var clause = clauses[c];
      var ratio = progressRatio(clause);
      if (ratio === null) continue;

      clauseRe.lastIndex = 0;
      var found = clauseRe.exec(clause);
      if (!found) continue;

      var from;
      var to;
      if (found[1] !== undefined && found[2] !== undefined) {
        from = Number(found[1]);
        to = Number(found[2]);
      } else if (found[3] !== undefined) {
        from = Number(found[3]);
        to = count;
      } else {
        from = Number(found[4]);
        to = from;
      }
      for (var n = from; n <= to && n <= count; n++) {
        if (n >= 1) ratios[n - 1] = ratio;
      }
    }

    var items = [];
    for (var k = 0; k < count; k++) {
      items.push({
        index: k + 1,
        label: title + " " + (k + 1),
        ratio: ratios[k],
        estimateMin: roundTo5(baseMin * ratios[k])
      });
    }

    return { title: title, count: count, unit: countMatch[2], items: items };
  }

  return {
    parse: parse,
    parseMany: parseMany,
    parseFixed: parseFixed,
    parseBatch: parseBatch,
    estimateFor: estimateFor
  };
})();

var parse = DP_PARSER.parse;
var parseMany = DP_PARSER.parseMany;
var parseFixed = DP_PARSER.parseFixed;
var estimateFor = DP_PARSER.estimateFor;
var parseBatch = DP_PARSER.parseBatch;

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    parse: DP_PARSER.parse,
    parseMany: DP_PARSER.parseMany,
    parseFixed: DP_PARSER.parseFixed,
    parseBatch: DP_PARSER.parseBatch,
    estimateFor: DP_PARSER.estimateFor
  };
}

</script>


<script>
  // PWA 版: プリフライトを避けるため text/plain で投げる。
  // GAS は 302 で最終URLへ飛ばすので、fetch が通らない環境向けに XHR で二度目を試す。
  window.DP_VOICE = true;
  window.DP_NEEDS_CONNECTION = true;

  window.DP_CALL = function (action, payload) {
    var conn = window.DP_CONNECTION;
    if (!conn || !conn.url) return Promise.reject(new Error("接続されていません"));
    var body = JSON.stringify({ action: action, key: conn.key, payload: payload || {} });

    return fetch(conn.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: body,
      redirect: "follow"
    })
      .then(function (res) { return res.json(); })
      .catch(function () { return xhrPost(conn.url, body); })
      .then(unwrap);
  };

  function xhrPost(url, body) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", url, true);
      xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
      xhr.onload = function () {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { reject(new Error("応答を読み取れませんでした")); }
      };
      xhr.onerror = function () { reject(new Error("通信できませんでした")); };
      xhr.send(body);
    });
  }

  function unwrap(res) {
    if (!res || res.ok !== true) throw new Error((res && res.error) || "処理できませんでした");
    return res.data;
  }
</script>




<script>
(function () {
  "use strict";

  var CONN_KEY = "dp.connection";
  var CACHE_KEY = "dp.cache.today";
  var CAT_VARS = ["--cat-1", "--cat-2", "--cat-3"];
  var PRIORITY_LABEL = { 1: "最優先", 2: "急ぎ", 3: "通常", 4: "いつでも" };

  var state = {
    view: "day",
    day: null,          // 表示中の1日（今日 or 選んだ日）
    dayKey: null,
    upcoming: null,
    settings: null,
    detailTaskId: null,
    touched: {},
    openedAt: Date.now(),
    startLogged: false,
    inflight: 0
  };

  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 接続 ---------- */

  function loadConnection() {
    if (!window.DP_NEEDS_CONNECTION) return true;
    try {
      var raw = localStorage.getItem(CONN_KEY);
      if (!raw) return false;
      window.DP_CONNECTION = JSON.parse(raw);
      return !!(window.DP_CONNECTION && window.DP_CONNECTION.url);
    } catch (e) { return false; }
  }

  function saveConnection(code) {
    var json = decodeURIComponent(escape(atob(code.replace(/-/g, "+").replace(/_/g, "/"))));
    var conn = JSON.parse(json);
    if (!conn.url || !conn.key) throw new Error("接続コードの中身が足りません");
    window.DP_CONNECTION = conn;
    try { localStorage.setItem(CONN_KEY, JSON.stringify(conn)); } catch (e) {}
  }

  /* ---------- 時刻 ---------- */

  function hm(value) {
    var d = new Date(value);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function hoursMinutes(min) {
    var h = Math.floor(min / 60);
    var m = min % 60;
    return h > 0 ? h + "時間" + (m ? m + "分" : "") : m + "分";
  }

  function parseKey(key) {
    var p = String(key).split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function keyOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function todayKey() { return keyOf(new Date()); }

  function addDaysKey(key, n) {
    var d = parseKey(key);
    d.setDate(d.getDate() + n);
    return keyOf(d);
  }

  function dateLabel(key) {
    var d = parseKey(key);
    var wd = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return d.getMonth() + 1 + "月" + d.getDate() + "日(" + wd + ")";
  }

  function categoryVar(name) {
    var list = (state.settings && state.settings.categories) || [];
    var i = list.indexOf(name);
    return i >= 0 ? "var(" + CAT_VARS[i % CAT_VARS.length] + ")" : "var(--text-3)";
  }

  function alertIcon() {
    return '<svg class="alert-icon" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">' +
      '<path d="M10 3.2 18 16.8H2z" stroke-linejoin="round"></path>' +
      '<path d="M10 8v4M10 14.4v.2" stroke-linecap="round"></path></svg>';
  }

  /* ---------- 通信（細い進捗線。画面は差し替えない） ---------- */

  function call(action, payload) {
    state.inflight += 1;
    $("progress").classList.add("on");
    return window.DP_CALL(action, payload).then(finish, function (err) {
      finish();
      throw err;
    });
  }

  function finish(value) {
    state.inflight = Math.max(0, state.inflight - 1);
    if (!state.inflight) $("progress").classList.remove("on");
    return value;
  }

  /* ---------- 1日の表示（今日 / 選んだ日） ---------- */

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) { return null; }
  }

  function writeCache(payload) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(payload)); } catch (e) {}
  }

  function loadToday(useCache) {
    if (useCache) {
      var cached = readCache();
      if (cached && cached.date === todayKey()) {
        state.day = cached;
        state.dayKey = cached.date;
        state.settings = cached.settings || state.settings;
        renderDay();
      }
    }
    return call("getToday", { now: new Date().toISOString() })
      .then(function (data) {
        state.day = data;
        state.dayKey = data.date;
        state.settings = data.settings;
        writeCache(data);
        $("staleBar").hidden = true;
        renderDay();
      })
      .catch(function (err) {
        if (state.day) $("staleBar").hidden = false;
        else renderEmpty($("dayBody"), err.message);
      });
  }

  function loadDay(key) {
    state.dayKey = key;
    return call("getDay", { date: key, now: new Date().toISOString() })
      .then(function (data) {
        state.day = data;
        renderDay();
      })
      .catch(function (err) { renderEmpty($("dayBody"), err.message); });
  }

  function renderDay() {
    var data = state.day;
    if (!data) return;
    var isToday = data.date === todayKey();

    $("backRow").hidden = isToday;
    $("dayTitle").textContent = dateLabel(data.date) + (isToday ? "" : "");
    $("daySub").textContent = isToday ? "今日" : "";
    $("dayTotals").textContent = data.plannedMin
      ? hoursMinutes(data.plannedMin) + " / 空き " + hoursMinutes(data.freeMin)
      : "空き " + hoursMinutes(data.freeMin);

    renderAlerts(isToday ? (data.warnings || []) : []);
    renderColumn(data, isToday);
    if (isToday) scrollToNow();
  }

  function renderAlerts(warnings) {
    var box = $("alertsBox");
    box.textContent = "";
    if (!warnings.length) return;

    var title = document.createElement("div");
    title.className = "group-title";
    title.textContent = "間に合いません";
    box.appendChild(title);

    var group = document.createElement("div");
    group.className = "group";
    warnings.forEach(function (w) {
      var cell = document.createElement("div");
      cell.className = "cell alert-cell";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "inner";
      btn.style.width = "100%";
      btn.innerHTML = alertIcon() + '<span><span class="title"></span><br><span class="meta"></span></span><span class="right">›</span>';
      btn.querySelector(".title").textContent = w.title;
      btn.querySelector(".meta").textContent = reasonText(w);
      btn.addEventListener("click", function () { openDetail(w.taskId); });
      cell.appendChild(btn);
      group.appendChild(cell);
    });
    box.appendChild(group);
  }

  /** 期限を「今日まで」「あと3日」の言い方にする。 */
  function dueWord(due) {
    if (!due) return "いつでも";
    var diff = Math.round((parseKey(due) - parseKey(todayKey())) / 86400000);
    if (diff < 0) return (-diff) + "日すぎ";
    if (diff === 0) return "今日まで";
    if (diff === 1) return "明日まで";
    if (diff <= 14) return "あと" + diff + "日";
    return due.slice(5).replace("-", "/") + "まで";
  }

  function reasonText(w) {
    if (w.type === "unplaced") return "置き場所がありません";
    if (w.type === "late") return w.due ? w.due + " までに終わりません" : "期限に間に合いません";
    if (w.startDeadline) return "着手期限 " + hm(w.startDeadline) + " を過ぎています";
    return "着手が遅れています";
  }

  function renderColumn(data, isToday) {
    var box = $("dayBody");
    box.textContent = "";
    var items = data.items || [];

    if (!items.length) {
      renderEmpty(box, isToday ? "今日ぶんの予定はありません" : "この日に置かれたものはありません");
      return;
    }

    var title = document.createElement("div");
    title.className = "group-title";
    title.textContent = isToday ? "時間割" : dateLabel(data.date) + " の時間割";
    box.appendChild(title);

    var group = document.createElement("div");
    group.className = "group";
    var now = new Date();
    var marked = false;

    items.forEach(function (item) {
      if (isToday && !marked && new Date(item.start) > now) {
        group.appendChild(nowLine(now));
        marked = true;
      }
      group.appendChild(itemCell(item, now, isToday));
    });
    if (isToday && !marked) group.appendChild(nowLine(now));

    box.appendChild(group);
  }

  function nowLine(now) {
    var div = document.createElement("div");
    div.className = "nowline";
    div.id = "nowMarker";
    div.innerHTML = '<span class="t"></span><span class="l"></span>';
    div.querySelector(".t").textContent = hm(now);
    return div;
  }

  function itemCell(item, now, isToday) {
    var cell = document.createElement("div");
    var past = isToday && new Date(item.end) <= now;
    cell.className = "cell " + item.type + (past ? " past" : "") + (item.loose ? " loose" : "");

    var inner = document.createElement(item.type === "block" ? "button" : "div");
    inner.className = "inner";
    if (item.type === "block") inner.type = "button";

    var time = document.createElement("span");
    time.className = "time";
    time.textContent = hm(item.start);

    var mid = document.createElement("span");
    var title = document.createElement("span");
    title.className = "title";
    title.textContent = item.title;
    var meta = document.createElement("span");
    meta.className = "meta";
    if (item.type === "event") {
      meta.textContent = "予定 " + hm(item.start) + "–" + hm(item.end);
    } else if (item.loose) {
      meta.textContent = item.category + " " + item.minutes + "分 · 空き時間ぶん";
    } else {
      meta.textContent = item.category + " " + item.minutes + "分 · " + dueWord(item.due);
    }
    mid.appendChild(title);
    mid.appendChild(document.createElement("br"));
    mid.appendChild(meta);

    var right = document.createElement("span");
    right.className = "right";

    if (item.type === "block") {
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.setProperty("--cat", categoryVar(item.category));
      right.appendChild(dot);
      inner.addEventListener("click", function () {
        if (cell.classList.contains("open")) { closeSwipes(); return; }
        openDetail(item.taskId);
      });
      cell.classList.add("swipe");
      attachSwipe(cell, inner, item.taskId);
    }

    inner.appendChild(time);
    inner.appendChild(mid);
    inner.appendChild(right);
    cell.appendChild(inner);
    return cell;
  }

  /* ---------- 横スワイプで削除 ---------- */

  function closeSwipes(except) {
    var open = document.querySelectorAll(".cell.open");
    for (var i = 0; i < open.length; i++) if (open[i] !== except) open[i].classList.remove("open");
  }

  var SWIPE_WIDTH = 176; // 完了 88 + 削除 88

  function attachSwipe(cell, inner, taskId) {
    var actions = document.createElement("div");
    actions.className = "swipe-actions";

    var done = document.createElement("button");
    done.type = "button";
    done.className = "done";
    done.textContent = "完了";
    done.addEventListener("click", function (e) {
      e.stopPropagation();
      completeTask(taskId);
    });

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.textContent = "削除";
    del.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteTask(taskId);
    });

    actions.appendChild(done);
    actions.appendChild(del);
    cell.insertBefore(actions, cell.firstChild);

    var startX = 0;
    var startY = 0;
    var dragging = false;
    var decided = false;

    cell.addEventListener("touchstart", function (e) {
      var t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      dragging = true;
      decided = false;
    }, { passive: true });

    cell.addEventListener("touchmove", function (e) {
      if (!dragging) return;
      var t = e.touches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;

      if (!decided) {
        // 縦に動いているならスクロールに譲る
        if (Math.abs(dy) > Math.abs(dx)) { dragging = false; return; }
        if (Math.abs(dx) < 8) return;
        decided = true;
        closeSwipes(cell);
      }
      var base = cell.classList.contains("open") ? -SWIPE_WIDTH : 0;
      var offset = Math.max(-SWIPE_WIDTH - 20, Math.min(0, base + dx));
      inner.style.transition = "none";
      inner.style.transform = "translateX(" + offset + "px)";
    }, { passive: true });

    cell.addEventListener("touchend", function (e) {
      if (!dragging) return;
      dragging = false;
      inner.style.transition = "";
      inner.style.transform = "";
      if (!decided) return;
      var dx = (e.changedTouches[0].clientX - startX);
      var wasOpen = cell.classList.contains("open");
      if (!wasOpen && dx < -44) cell.classList.add("open");
      else if (wasOpen && dx > 44) cell.classList.remove("open");
    });
  }

  // 作業開始前は最上部、作業中は現在時刻を上へ、終了後は最下部。
  function scrollToNow() {
    var scroll = $("scroll");
    var settings = state.settings;
    if (!settings) return;
    var now = new Date();
    var minutes = now.getHours() * 60 + now.getMinutes();
    var startMin = toMinutes(settings.workStart, 480);
    var endMin = toMinutes(settings.workEnd, 1440);

    if (minutes < startMin) { scroll.scrollTop = 0; return; }
    if (minutes >= endMin) { scroll.scrollTop = scroll.scrollHeight; return; }
    var marker = $("nowMarker");
    if (marker) scroll.scrollTop = Math.max(0, marker.offsetTop - 80);
  }

  function toMinutes(text, fallback) {
    var m = String(text || "").match(/^(\d{1,2}):(\d{2})$/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : fallback;
  }

  function renderEmpty(box, message) {
    box.textContent = "";
    var div = document.createElement("div");
    div.className = "empty";
    div.textContent = message;
    box.appendChild(div);
  }

  function renderUpcoming() {

  /* ---------- 追加：喋った塊を仕分けて、確認して、まとめて保存 ---------- */

  var DEFAULT_ESTIMATE = 30; // 見積を言わなかったときの仮の値。確認画面で直せる。
  var KIND_LABEL = { task: "1回", goal: "目標", routine: "日課", project: "案件" };
  var review = [];   // 仕分けた結果。確認画面で編集される
  var editingIndex = -1;

  function openAdd() {
    $("catchInput").value = "";

    $("addSheet").hidden = false;

  }

  function closeAdd() {

    $("addSheet").hidden = true;
  }

  function showStage(name) {
    $("stageSpeak").hidden = name !== "speak";
    $("stageReview").hidden = name !== "review";
    $("addStageTitle").textContent = name === "speak" ? "追加" : "これでいいですか";
  }

  function parserOptions() {
    var settings = state.settings || {};
    return {
      projectTypes: settings.projectTypes || [],
      categoryHints: settings.categoryHints || null
    };
  }

  function updateSaveState() {
    $("toReview").disabled = !($("catchInput").value || "").trim();
  }

  /** 喋った塊を項目に割って、確認画面へ。 */
  function toReview() {
    var text = $("catchInput").value.trim();
    if (!text) return;
    if (typeof parseMany !== "function") {
      $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "解析を読み込めていません。画面を更新してください。";
      return;
    }

    review = parseMany(text, new Date(), parserOptions()).map(function (r) {
      // 期限を言わなかった数量もの（「編集が10人分」）は、期限を聞かずに
      // まとめて1件のタスクにする。日付を尋ねる画面を出さないため。
      if (r.needsDue && r.quantity && r.perItemMin) {
        r = {
          kind: "task", title: r.title + " " + r.quantity + (r.unit || "件"),
          estimateMin: r.quantity * r.perItemMin, due: null, priority: r.priority,
          category: r.category, quantity: null, unit: null, current: 0,
          perItemMin: null, per: null, weekdays: null, count: 1
        };
      }
      return r;
    }).map(function (r) {
      return {
        kind: r.kind === "project" ? "task" : r.kind, // 案件はまだ作れないので1回型に寄せる
        title: r.title,
        estimateMin: r.estimateMin || (r.perItemMin ? null : DEFAULT_ESTIMATE),
        provisional: false,
        due: r.due,
        priority: r.priority,
        category: r.category || (state.settings && state.settings.defaultCategory) || null,
        quantity: r.quantity,
        unit: r.unit,
        current: r.current || 0,
        perItemMin: r.perItemMin || (r.kind === "goal" || (r.kind === "routine" && r.quantity) ? DEFAULT_ESTIMATE : null),
        per: r.per,
        weekdays: r.weekdays,
        needsDue: !!r.needsDue
      };
    });

    if (!review.length) {
      $(voiceTarget === "planInput" ? "planMsg" : "addMsg").textContent = "項目を取り出せませんでした。言い直してください。";
      return;
    }
    showStage("review");
    renderReview();
  }

  /** 今日 / 明日 / 一週間以内 / 二週間以内 / それ以降 / 期限なし に振り分けて見せる。 */
  function reviewBuckets() {
    var today = todayKey();
    var groups = [
      { label: "期限を決めてください", test: function (r) { return r.needsDue; } },
      { label: "毎日・毎週", test: function (r) { return r.kind === "routine"; } },
      { label: "今日", test: function (r) { return r.due && r.due <= today; } },
      { label: "明日", test: function (r) { return r.due === addDaysKey(today, 1); } },
      { label: "一週間以内", test: function (r) { return r.due && r.due <= addDaysKey(today, 7); } },
      { label: "二週間以内", test: function (r) { return r.due && r.due <= addDaysKey(today, 14); } },
      { label: "それ以降", test: function (r) { return !!r.due; } },
      { label: "いつでも", test: function () { return true; } }
    ];

    var used = {};
    return groups.map(function (g) {
      var rows = [];
      review.forEach(function (r, i) {
        if (used[i] || !g.test(r)) return;
        used[i] = true;
        rows.push({ item: r, index: i });
      });
      return { label: g.label, rows: rows };
    }).filter(function (g) { return g.rows.length; });
  }

  function renderReview() {
    var box = $("reviewList");
    box.textContent = "";

    var minutes = review.reduce(function (sum, r) {
      return sum + (r.estimateMin || (r.quantity || 0) * (r.perItemMin || 0));
    }, 0);
    $("reviewSummary").textContent = review.length + "件 / 合わせて " + hoursMinutes(minutes);

    reviewBuckets().forEach(function (group) {
      var title = document.createElement("div");
      title.className = "group-title";
      title.textContent = group.label;
      box.appendChild(title);

      var wrap = document.createElement("div");
      wrap.className = "group";
      group.rows.forEach(function (row) { wrap.appendChild(reviewCell(row.item, row.index)); });
      box.appendChild(wrap);
    });
  }

  function reviewCell(item, index) {
    var cell = document.createElement("div");
    cell.className = "cell";

    var inner = document.createElement("div");
    inner.className = "inner";
    inner.style.gridTemplateColumns = "40px minmax(0,1fr) auto";

    var badge = document.createElement("span");
    badge.className = "kind-badge";
    badge.textContent = KIND_LABEL[item.kind] || "1回";

    var mid = document.createElement("button");
    mid.type = "button";
    mid.style.textAlign = "left";
    mid.style.width = "100%";
    var name = document.createElement("span");
    name.className = "title";
    name.textContent = item.title;
    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = reviewMeta(item);
    mid.appendChild(name);
    mid.appendChild(document.createElement("br"));
    mid.appendChild(meta);
    mid.addEventListener("click", function () { openEdit(index); });

    var right = document.createElement("span");
    right.className = "right";
    var dot = document.createElement("span");
    dot.className = "dot";
    dot.style.setProperty("--cat", categoryVar(item.category));
    right.appendChild(dot);
    var drop = document.createElement("button");
    drop.type = "button";
    drop.textContent = "×";
    drop.setAttribute("aria-label", "この項目を消す");
    drop.style.color = "var(--text-3)";
    drop.style.fontSize = "20px";
    drop.style.padding = "0 4px";
    drop.addEventListener("click", function () {
      review.splice(index, 1);
      if (!review.length) { showStage("speak"); return; }
      renderReview();
    });
    right.appendChild(drop);

    inner.appendChild(badge);
    inner.appendChild(mid);
    inner.appendChild(right);
    cell.appendChild(inner);
    return cell;
  }

  function reviewMeta(item) {
    var bits = [];
    if (item.category) bits.push(item.category);
    if (item.kind === "goal") {
      var left = Math.max(0, (item.quantity || 0) - (item.current || 0));
      var days = item.due ? Math.max(1, Math.round((parseKey(item.due) - parseKey(todayKey())) / 86400000) + 1) : 0;
      bits.push((item.current || 0) + "/" + item.quantity + (item.unit || "件"));
      if (days) {
        bits.push(dateLabel(item.due) + "まで あと" + days + "日");
        bits.push("週" + (Math.round(left / days * 70) / 10) + (item.unit || "件") + "のペース");
      }
      if (item.needsDue) bits.push("いつまでに？");
    } else if (item.kind === "routine") {
      if (item.quantity) bits.push(item.quantity + (item.unit || "件") + (item.per === "week" ? "/週" : "/日"));
      if (item.perItemMin) bits.push("1件" + item.perItemMin + "分");
      if (item.estimateMin) bits.push(item.estimateMin + "分");
      if (item.weekdays) bits.push(item.weekdays.map(function (d) { return "日月火水木金土"[d]; }).join(""));
    } else {
      bits.push(item.estimateMin + "分");
      if (item.due) bits.push(item.due.slice(5).replace("-", "/"));
    }
    return bits.join(" · ");
  }

  /* ---------- 1件を直す ---------- */

  function openEdit(index) {
    editingIndex = index;

    $("eTitle").value = item.title || "";
    $("eKind").value = item.kind;
    $("eEstimate").value = item.estimateMin || "";
    $("eDue").value = item.due || "";
    $("ePriority").value = String(item.priority || 3);
    $("eQuantity").value = item.quantity || "";
    $("eCurrent").value = item.current || 0;

  function syncEditRows() {

    $("eQuantityRow").hidden = kind === "task";
    $("eCurrentRow").hidden = kind !== "goal";
    $("ePerItemRow").hidden = kind === "task";
  }

  function closeEdit() {
    $("editBackdrop").hidden = true;
    $("editSheet").hidden = true;
    editingIndex = -1;
  }

  function applyEdit() {

    var item = review[editingIndex];
    item.title = $("eTitle").value.trim() || item.title;
    item.kind = $("eKind").value;
    item.estimateMin = Number($("eEstimate").value) || null;
    item.provisional = false;
    item.due = $("eDue").value || null;
    item.needsDue = item.kind === "goal" && !item.due;
    item.priority = Number($("ePriority").value) || 3;
    item.category = $("eCategory").value;
    item.quantity = Number($("eQuantity").value) || null;
    item.current = Number($("eCurrent").value) || 0;
    item.perItemMin = Number($("ePerItem").value) || null;

  function fillCategories(select, selected) {
    select.textContent = "";
    var cats = (state.settings && state.settings.categories) || ["仕事", "大学", "個人"];
    cats.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
    if (selected) select.value = selected;
    else if (state.settings && state.settings.defaultCategory) select.value = state.settings.defaultCategory;
  }

  /* ---------- まとめて保存 ---------- */

  function saveAll() {
    if (!review.length) return;

    // 目標は期限が無いと配分（今日ぶん何件か）を計算できない。ここで止める。
    var missing = review.filter(function (r) { return r.kind === "goal" && !r.due; });
    if (missing.length) {
      $("reviewMsg").textContent =
        "「" + missing[0].title + "」の期限を決めてください。いつまでかが無いと1日ぶんを計算できません。";
      return;
    }

    $("saveAll").disabled = true;
    $("reviewMsg").textContent = "保存しています";

    var jobs = review.map(function (item) {
      if (item.kind === "goal") {
        return call("addGoal", {
          goal: {
            name: item.title,
            category: item.category,
            target: item.quantity,
            unit: item.unit || "件",
            current: item.current || 0,
            startDate: todayKey(),
            due: item.due,
            perItemMin: item.perItemMin || DEFAULT_ESTIMATE,
            dailyCap: 0,
            priority: item.priority
          }
        });
      }
      if (item.kind === "routine") {
        return call("addRoutine", {
          routine: {
            name: item.title,
            category: item.category,
            quantity: item.quantity || null,
            unit: item.unit || null,
            per: item.per || "day",
            perItemMin: item.perItemMin || null,
            minutes: item.quantity ? null : (item.estimateMin || DEFAULT_ESTIMATE),
            weekdays: item.weekdays || null,
            priority: item.priority
          }
        });
      }
      return call("addTask", {
        task: {
          title: item.title,
          estimateMin: item.estimateMin || DEFAULT_ESTIMATE,
          due: item.due || "",
          priority: item.priority,
          category: item.category,
          source: state.usedVoice ? "音声" : "手入力"
        }
      });
    });

    Promise.all(jobs)
      .then(function () {
        logKpi("addMany", Date.now() - state.addOpenedAt);
        closeAdd();
        return refreshAll();
      })
      .catch(function (err) {
        $("reviewMsg").textContent = err.message;
        $("saveAll").disabled = false;
      });
  }

  /* ---------- 今日を組む：先に埋まっている時間を喋る ---------- */

  /** すでに登録してある固定予定を出しておく。言い直すと丸ごと置き換わる。 */
  function loadFixedForDay() {

  function parsePlanInput() {
    var text = $("planInput").value.trim();
    if (!text) return;
    if (typeof parseFixed !== "function") {
      $("planMsg").textContent = "解析を読み込めていません。画面を更新してください。";
      return;
    }
    var found = parseFixed(text, new Date());
    if (!found.length) {
      $("planMsg").textContent = "時刻が読み取れませんでした。「10時から17時」のように言ってください。";

  function renderPlanPreview() {
